## template: jinja
#cloud-config
# Tesserae Pi client, automated install via cloud-init.
#
# What this is for:
#   A dedicated Raspberry Pi driving a Pimoroni Inky panel (Impression,
#   wHAT or pHAT). Boots a fresh Raspberry Pi OS Lite, installs the
#   tesserae-device-pi client from PyPI + its systemd service, and starts
#   polling your Tesserae server. The panel is auto-detected from the
#   HAT's EEPROM, and the client keeps itself up to date with signed
#   updates from the server's Settings -> Firmware.
#
# NOT for the Tesserae server itself, that's scripts/cloud-init.yaml.
#
# Two-file setup (Pi Imager path):
#   1. Pi Imager: flash Raspberry Pi OS Lite (64-bit) onto an SD card.
#      In the Advanced options dialog (Ctrl/Cmd-Shift-X) configure
#      WiFi + locale, and optionally an SSH public key. DO NOT set a
#      username here, this file creates one below.
#   2. After flashing, eject + re-mount the SD card on your computer.
#      Open the BOOT partition.
#   3. Copy this file to BOOT/user-data as-is. You do NOT edit this
#      file. All per-install settings live in meta-data next to it.
#   4. Open BOOT/meta-data and add a server_url line, keeping the
#      existing instance-id. Full example at the bottom of this file.
#   5. Insert the SD card into the Pi and power it on. First boot is
#      5 to 10 minutes (apt install + pip install + Inky deps); after
#      that the daemon starts and announces itself to the server.
#   6. Open your Tesserae server's web UI -> Settings -> Devices ->
#      Discovered. Click Register on the new Pi entry.
#
# Persistent state lives in:
#   /home/tesserae/.venvs/tesserae-device-pi/     (venv the client runs from)
#   /home/tesserae/.config/tesserae-device-pi/    (config.toml)
#   /home/tesserae/.cache/tesserae-device-pi/     (frame cache, update staging)
#
# Reboot behaviour: enabling SPI/I2C requires a reboot before the
# panel can be driven. cloud-init triggers one (power_state below);
# after the reboot the systemd unit starts automatically.

package_update: true
package_upgrade: false

# Everything install.sh's apt step used to install, now inline so
# cloud-init handles it directly (no `sudo` shelling that needs a
# tty). Runtime deps for pip-installed inky + Pillow + numpy.
packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - libopenjp2-7
  - libtiff6

# cloud-init's native raspi-config equivalents. Handles the same
# switches install.sh used to shell out for. Avoids `raspi-config
# nonint do_spi 0` which needs sudo + a controlling terminal.
rpi:
  interfaces:
    spi: true
    i2c: true

users:
  - name: tesserae
    gecos: ""
    shell: /bin/bash
    lock_passwd: true
    # gpio + spi give the user access to the Inky HAT without sudo on
    # every paint; sudo stays for interactive troubleshooting after
    # first boot, not for the install itself.
    groups:
      - sudo
      - gpio
      - i2c
      - spi
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    # The cloud-init has no other password set, so without a key this
    # account is unreachable.
    {% if ds.meta_data.ssh_key %}ssh_authorized_keys:
      - {{ ds.meta_data.ssh_key }}
    {% endif %}

# All the config the runcmd steps below need. Written before the
# users step runs, so ownership is fixed with a top-level chown.
write_files:
  # 1. dtoverlay=spi0-0cs, the third thing install.sh's raspi-config
  #    step did (rpi.interfaces above covered the SPI+I2C toggles).
  #    Enables single-CS mode on SPI0 which the Inky HAT expects.
  - path: /boot/firmware/config.txt
    append: true
    content: |

      # Added by tesserae pi-client cloud-init: single-CS mode on SPI0
      # for the Pimoroni Inky HAT.
      dtoverlay=spi0-0cs

  # 2. Client config, jinja-templated from meta-data. server_url (and
  #    the optional device_id) come out of your meta-data file. The
  #    client fills in the rest of the file (pairing token, timezone,
  #    every other section at its default) the first time it saves.
  - path: /home/tesserae/.config/tesserae-device-pi/config.toml
    defer: true
    owner: tesserae:tesserae
    permissions: "0600"
    content: |
      # Tesserae Pi client config (tesserae-device-pi).
      # Default transport is REST (no broker required); flip to mqtt
      # below + populate the [mqtt] block if you already run a broker.
      transport_mode = "rest"

      # [mqtt] holds device_id, which identifies this Pi in every
      # transport. The rest of the section is read ONLY when
      # transport_mode = "mqtt"; keep it for the day you move to a broker.
      [mqtt]
      host = ""              # broker hostname when using MQTT transport
      port = 1883
      username = ""
      password = ""
      client_id = "pi-impression-1"  # MQTT client id; only matters if two Pi clients share a broker
      device_id = "{{ ds.meta_data.device_id | default('pi_device') }}"
      keepalive = 60

      [rest]
      server_url = "{{ ds.meta_data.server_url }}"
      device_token = ""    # auto-populated after Register; do not edit by hand
      pairing_code = ""    # optional: paste a Settings -> Devices pairing code
      poll_interval_s = 60 # fallback wake interval if server omits next_poll_s

      [http]
      download_timeout_s = 30
      max_frame_bytes = 16000000

      [logging]
      level = "INFO"

  # 3. systemd unit for the client. The same unit tesserae-device-pi's
  #    install-service.sh installs, inlined here so we don't have to
  #    shell out to it. ExecStartPre is the update rollback guard: it
  #    puts the previous version back if an update fails to start three
  #    times, and its leading "-" means a missing guard never blocks a start.
  - path: /etc/systemd/system/tesserae-device-pi.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Tesserae Raspberry Pi client (Pimoroni e-ink panel)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=tesserae
      Group=tesserae
      SupplementaryGroups=gpio spi
      ExecStartPre=-/home/tesserae/.venvs/tesserae-device-pi/bin/python /home/tesserae/.cache/tesserae-device-pi/ota-guard.py /home/tesserae/.cache/tesserae-device-pi/ota-pending.json
      ExecStart=/usr/local/bin/tesserae-device-pi
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # write_files runs BEFORE users when cloud-init creates the home
  # directory in the same run, so anything write_files planted under
  # /home/tesserae lands owned by root. Top-level chown so
  # everything write_files planted plus anything the subsequent
  # user-creation step populates lands owned by tesserae.
  - chown -R tesserae:tesserae /home/tesserae

  # Build the venv and install the client from PyPI (it pulls inky[rpi]),
  # all as the tesserae user so the venv stays writable by the client:
  # it installs its own signed updates into this venv. `su -c ... <user>`
  # runs without a controlling terminal, unlike the `sudo` install.sh
  # relies on, which is why this skips install.sh.
  - su -c 'python3 -m venv /home/tesserae/.venvs/tesserae-device-pi' tesserae
  - su -c '/home/tesserae/.venvs/tesserae-device-pi/bin/pip install --upgrade pip' tesserae
  - su -c '/home/tesserae/.venvs/tesserae-device-pi/bin/pip install tesserae-device-pi' tesserae

  # Pi 5 / Bookworm: RPi.GPIO does not drive those boards; rpi-lgpio
  # stands in for it. Harmless to skip elsewhere.
  - |
    if grep -q "Raspberry Pi 5" /proc/device-tree/model 2>/dev/null; then
      su -c '/home/tesserae/.venvs/tesserae-device-pi/bin/pip install rpi-lgpio' tesserae
    fi

  # The update rollback guard runs from the cache dir, outside the venv,
  # so a broken update can't take the guard down with it.
  - su -c 'mkdir -p /home/tesserae/.cache/tesserae-device-pi' tesserae
  - su -c 'cp "$(/home/tesserae/.venvs/tesserae-device-pi/bin/python -c "import tesserae_device_pi.ota_guard as g; print(g.__file__)")" /home/tesserae/.cache/tesserae-device-pi/ota-guard.py' tesserae

  # Symlink the client entry-point into /usr/local/bin so the
  # systemd unit's ExecStart resolves. Run as root (default runcmd
  # user), no need for sudo.
  - ln -sf /home/tesserae/.venvs/tesserae-device-pi/bin/tesserae-device-pi /usr/local/bin/tesserae-device-pi

  # Enable the systemd unit. systemctl start would fail here because
  # SPI/I2C don't take effect until the post-cloud-init reboot below;
  # enable + reboot is how the service starts cleanly on second boot.
  - systemctl daemon-reload
  - systemctl enable tesserae-device-pi.service

# SPI, I2C and the spi0-0cs overlay take effect only after a reboot, so
# cloud-init reboots once it has finished; the service starts on the
# second boot.
power_state:
  mode: reboot
  message: Rebooting so SPI and I2C take effect for the Inky panel
  condition: true

final_message: |
  Tesserae Pi client (tesserae-device-pi) installed.

  Service: systemctl status tesserae-device-pi
  Logs:    journalctl -u tesserae-device-pi -f
  Config:  /home/tesserae/.config/tesserae-device-pi/config.toml

  Next step: open your Tesserae server's web UI, go to
  Settings -> Devices -> Discovered, and click Register on the new
  Pi entry. The daemon picks up its access token on the next poll.

# --------------------------------------------------------------
# meta-data companion file
# --------------------------------------------------------------
# Alongside this file, edit BOOT/meta-data to look like:
#
#   instance-id: pi-inky-01
#   server_url: http://tesserae.local:8765
#   device_id: pi_lounge
#   ssh_key: ssh-ed25519 AAAA...your-key...
#
# `server_url` is mandatory: your Tesserae server's base URL
# (whatever you'd type in a browser to reach the web UI).
#
# `device_id` is optional (default pi_device). Give each Pi its own
# when you run more than one: lowercase, 2-32 characters, starting
# with a letter.
#
# There is no panel setting: the client reads the panel from the
# Inky HAT's EEPROM. An older meta-data's `model:` line is ignored.
#
# `ssh_key` is optional, but without a key the account is
# unreachable.
#
# All values from `meta-data` are substituted into the `user-data` template
# above at first-boot time via jinja. That's the WHOLE per-flash
# edit: add the necessary keys to meta-data. This user-data file stays
# untouched flash-to-flash.
