## template: jinja
#cloud-config
# Tesserae Pi client, automated install via cloud-init.
#
# What this is for:
#   A dedicated Raspberry Pi driving a Pimoroni Inky Impression panel.
#   Boots a fresh Raspberry Pi OS Lite, installs the tesserae-device-pi-bin
#   client + its systemd service, and starts polling your Tesserae server.
#
# NOT for the Tesserae server itself, that's scripts/cloud-init.yaml.
#
# Two-file setup (Pi Imager path):
#   1. Pi Imager: flash Raspberry Pi OS Lite (64-bit) onto an SD card.
#      In the Advanced options dialog (Ctrl/Cmd-Shift-X) configure
#      WiFi + locale, and optionally an SSH public key. DO NOT set a
#      username here, this file creates one below.
#   2. After flashing, eject + re-mount the SD card on your computer.
#      Open the BOOT partition.
#   3. Copy this file to BOOT/user-data as-is. You do NOT edit this
#      file. All per-install settings live in meta-data next to it.
#   4. Open BOOT/meta-data and add two lines (server_url + model),
#      keeping the existing instance-id. Full example at the bottom
#      of this file.
#   5. Insert the SD card into the Pi and power it on. First boot is
#      5 to 10 minutes (apt install + pip install + Inky deps); after
#      that the daemon starts and announces itself to the server.
#   6. Open your Tesserae server's web UI -> Settings -> Devices ->
#      Discovered. Click Register on the new Pi entry.
#
# Persistent state lives in:
#   /home/tesserae/tesserae-device-pi-bin/         (repo + venv)
#   /home/tesserae/.config/tesserae-pi-bin-client/ (config.toml)
#
# Reboot behaviour: enabling SPI/I2C requires a reboot before the
# panel can be driven. cloud-init triggers one (power_state below);
# after the reboot the systemd unit starts automatically.

package_update: true
package_upgrade: false

# Everything install.sh's apt step used to install, now inline so
# cloud-init handles it directly (no `sudo` shelling that needs a
# tty). Runtime deps for pip-installed inky + Pillow + numpy.
packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - libopenjp2-7
  - libtiff6

# cloud-init's native raspi-config equivalents. Handles the same
# switches install.sh used to shell out for. Avoids `raspi-config
# nonint do_spi 0` which needs sudo + a controlling terminal.
rpi:
  interfaces:
    spi: true
    i2c: true

users:
  - name: tesserae
    gecos: ""
    shell: /bin/bash
    lock_passwd: true
    # gpio + spi give the user access to the Inky HAT without sudo on
    # every paint; sudo stays for interactive troubleshooting after
    # first boot, not for the install itself.
    groups:
      - sudo
      - gpio
      - i2c
      - spi
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    # The cloud-init has no other password set, so without a key this
    # account is unreachable.
    {% if ds.meta_data.ssh_key %}ssh_authorized_keys:
      - {{ ds.meta_data.ssh_key }}
    {% endif %}

# All the config the runcmd steps below need. Written before the
# users step runs, so ownership is fixed with a top-level chown.
write_files:
  # 1. dtoverlay=spi0-0cs, the third thing install.sh's raspi-config
  #    step did (rpi.interfaces above covered the SPI+I2C toggles).
  #    Enables single-CS mode on SPI0 which the Inky HAT expects.
  - path: /boot/firmware/config.txt
    append: true
    content: |

      # Added by tesserae pi-client cloud-init: single-CS mode on SPI0
      # for the Pimoroni Inky HAT.
      dtoverlay=spi0-0cs

  # 2. Client config, jinja-templated from meta-data. server_url +
  #    model come out of your meta-data file; everything else is a
  #    default that works for a REST setup out of the box.
  - path: /home/tesserae/.config/tesserae-pi-bin-client/config.toml
    defer: true
    owner: tesserae:tesserae
    permissions: "0600"
    content: |
      # Tesserae pi-bin client config.
      # Default transport is REST (no broker required); flip to mqtt
      # below + populate the [mqtt] block if you already run a broker.
      transport_mode = "rest"

      # [mqtt] is used ONLY when transport_mode = "mqtt" above.
      # For the default transport_mode = "rest" this whole section is
      # inert: the client never reads host / client_id / device_id /
      # anything else from here. You do NOT need to change any of
      # these values for a REST setup. Keep them for the day you
      # decide to flip to an MQTT broker.
      [mqtt]
      host = ""              # broker hostname when using MQTT transport
      port = 1883
      username = ""
      password = ""
      client_id = "pi-impression-1"  # MQTT client id; only matters if two Pi clients share a broker
      device_id = "pi_bin"           # MQTT topic prefix: tesserae/<device_id>/...
      keepalive = 60

      [rest]
      server_url = "{{ ds.meta_data.server_url }}"
      device_token = ""    # auto-populated after Register; do not edit by hand
      pairing_code = ""    # optional: paste a Settings -> Devices pairing code
      last_frame_etag = "" # auto-populated for If-None-Match short-circuit
      poll_interval_s = 60 # fallback wake interval if server omits next_poll_s

      [panel]
      model = "{{ ds.meta_data.model }}"

      [http]
      download_timeout_s = 30
      max_frame_bytes = 16000000

      [logging]
      level = "INFO"

  # 3. systemd unit for the client. Same shape as the one
  #    tesserae-device-pi-bin's install-service.sh installs, inlined
  #    here so we don't have to shell out to it.
  - path: /etc/systemd/system/tesserae-pi-bin-client.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Tesserae Pi .bin client (model {{ ds.meta_data.model }})
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=tesserae
      Group=tesserae
      SupplementaryGroups=gpio spi
      ExecStart=/usr/local/bin/tesserae-pi-bin-client
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # write_files runs BEFORE users when cloud-init creates the home
  # directory in the same run, so anything write_files planted under
  # /home/tesserae lands owned by root. Top-level chown so
  # everything write_files planted plus anything the subsequent
  # user-creation step populates lands owned by tesserae.
  - chown -R tesserae:tesserae /home/tesserae

  # Clone the client repo. `su -c ... <user>` runs without a
  # controlling terminal, unlike `sudo` which install.sh used to
  # rely on. That's the whole reason we skip install.sh here.
  - su -c 'git clone https://github.com/dmellok/tesserae-device-pi-bin.git /home/tesserae/tesserae-device-pi-bin' tesserae

  # Build the venv + pip-install the client + inky[rpi] extras, all
  # as the tesserae user so the venv permissions stay right.
  - su -c 'python3 -m venv /home/tesserae/tesserae-device-pi-bin/.venv' tesserae
  - su -c '/home/tesserae/tesserae-device-pi-bin/.venv/bin/pip install --upgrade pip' tesserae
  - su -c '/home/tesserae/tesserae-device-pi-bin/.venv/bin/pip install -e "/home/tesserae/tesserae-device-pi-bin[rpi]"' tesserae

  # Symlink the client entry-point into /usr/local/bin so the
  # systemd unit's ExecStart resolves. Run as root (default runcmd
  # user), no need for sudo.
  - ln -sf /home/tesserae/tesserae-device-pi-bin/.venv/bin/tesserae-pi-bin-client /usr/local/bin/tesserae-pi-bin-client

  # Enable the systemd unit. systemctl start would fail here because
  # SPI/I2C don't take effect until the post-cloud-init reboot below;
  # enable + reboot is how the service starts cleanly on second boot.
  - systemctl daemon-reload
  - systemctl enable tesserae-pi-bin-client.service

final_message: |
  Tesserae pi-bin client installed.

  Service: systemctl status tesserae-pi-bin-client
  Logs:    journalctl -u tesserae-pi-bin-client -f
  Config:  /home/tesserae/.config/tesserae-pi-bin-client/config.toml

  Next step: open your Tesserae server's web UI, go to
  Settings -> Devices -> Discovered, and click Register on the new
  Pi entry. The daemon picks up its access token on the next poll.

# --------------------------------------------------------------
# meta-data companion file
# --------------------------------------------------------------
# Alongside this file, edit BOOT/meta-data to look like:
#
#   instance-id: pi-inky-01
#   server_url: http://tesserae.local:8765
#   model: inky_13_3
#   ssh_key: ssh-ed25519 AAAA...your-key...
#
# `server_url` and `model` are mandatory.
#
# `server_url` is your Tesserae server's base URL (whatever you'd
# type in a browser to reach the web UI). `model` is one of:
#
#   inky_4 | inky_5_7 | inky_7_3 | inky_13_3
#
# `ssh_key` is optional, but without a key the account is
# unreachable.
#
# All values from `meta-data` are substituted into the `user-data` template
# above at first-boot time via jinja. That's the WHOLE per-flash
# edit: add the necessary keys to meta-data. This user-data file stays
# untouched flash-to-flash.
