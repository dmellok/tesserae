#cloud-config
# Tesserae self-hosted dashboard server, automated install via cloud-init.
#
# Tested on Debian Trixie under Ubuntu MicroCloud (Raspberry Pi) and
# Proxmox VE LXC (x86). Pass via your LXC launcher's user-data field, e.g.:
#
#   lxc launch images:debian/trixie/cloud tesserae \
#     --config=user.user-data="$(cat scripts/cloud-init.yaml)"
#
# Note the /cloud suffix. The slim images:debian/trixie image does not
# include cloud-init, so the user-data block is silently ignored.
#
# Or, on Proxmox: paste into Datacenter > CT > Cloud-Init > User Data.
#
# DO NOT run Tesserae open to the internet. The auth model is a single
# password gate intended for a trusted home LAN. Use a homelab box, a Pi
# on your LAN, or a private network. If you need remote access, put
# Tesserae behind a VPN (Tailscale, WireGuard, ZeroTier).
#
# What this does:
#   1. Installs git, python3, python3.13-venv, openssh-server, less, rsync.
#   2. Creates a non-root `tesserae` user.
#   3. Clones Tesserae into ~tesserae/tesserae and builds the venv.
#   4. Installs Playwright's bundled Chromium plus its system runtime deps
#      so the webpage widget and Send -> Webpage tab work out of the box.
#   5. Installs the systemd unit so the service starts on boot.
#
# What this does NOT do:
#   - Open ports in any host firewall.
#   - Provision an MQTT broker. Point Tesserae at one via Settings -> Server
#     after first boot, or toggle on the built-in broker.
#
# Persistent state lives at /home/tesserae/tesserae/data/. Back up that
# directory (pages, settings, devices, themes, render cache, sqlite logs).
#
# Expected first-boot duration: ~3 to 8 minutes on a Pi 4 / CM4, dominated
# by `pip install`. Check progress with `tail -f /var/log/cloud-init-output.log`
# inside the container.

package_update: true
package_upgrade: false

packages:
  - git
  - python3
  - python3.13-venv
  - openssh-server
  - less
  - rsync

users:
  - name: tesserae
    gecos: ""
    shell: /bin/bash
    lock_passwd: true
    # Add your SSH public key here to log in as the tesserae user.
    # ssh_authorized_keys:
    #   - ssh-ed25519 AAAA...your-key...

runcmd:
  # Install the newest tagged release rather than whatever ``main`` is on
  # the day the container boots. The tag is resolved at boot from the
  # remote tag list, not hardcoded here: a hardcoded pin (issue #328) goes
  # stale the moment the next release lands and nobody notices for months.
  # ``--sort=-v:refname`` sorts numerically, so v0.100.0 beats v0.71.2.
  # If the tag list can't be read (no network yet, GitHub down), fall back
  # to ``main`` so the install still completes. To pin a specific version
  # instead, replace the whole block with a plain
  # ``git clone --branch vX.Y.Z --depth 1 ... /home/tesserae/tesserae``.
  - |
    su - tesserae -c '
      repo=https://github.com/dmellok/tesserae.git
      tag=$(git ls-remote --refs --tags --sort=-v:refname "$repo" "v[0-9]*" \
            2>/dev/null | head -n1 | sed "s#.*/##")
      if [ -n "$tag" ]; then
        echo "tesserae: installing release $tag"
        git clone --branch "$tag" --depth 1 "$repo" /home/tesserae/tesserae
      else
        echo "tesserae: could not resolve a release tag, using main"
        git clone --depth 1 "$repo" /home/tesserae/tesserae
      fi
    '
  - su - tesserae -c 'cd /home/tesserae/tesserae && python3 -m venv .venv'
  - su - tesserae -c 'cd /home/tesserae/tesserae && .venv/bin/pip install -e ".[dev]"'
  - /home/tesserae/tesserae/.venv/bin/playwright install-deps chromium
  - su - tesserae -c 'cd /home/tesserae/tesserae && .venv/bin/playwright install chromium'
  - env NONINTERACTIVE=1 TESSERAE_USER=tesserae TESSERAE_DIR=/home/tesserae/tesserae bash /home/tesserae/tesserae/scripts/install-systemd.sh

final_message: |
  Tesserae installed and running as a systemd service.
  Open http://<container-ip>:8765/ to finish setup.
  Logs: journalctl -u tesserae -f
