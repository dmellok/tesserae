name: Feature request
description: Propose a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have something half-formed? Floating it in [Discussions](https://github.com/dmellok/tesserae/discussions) first is often faster than opening an issue. Issues are for shapes you can describe in one sentence.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I want to do X but Y gets in the way."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might Tesserae solve it? Sketch the UI, the config shape, or the API surface as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you tried, related projects you looked at.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use cases, screenshots, links, anything that helps weigh whether this belongs in the core vs. as a plugin.
