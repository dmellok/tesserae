name: Widget idea
description: Pitch a new widget, your own to build, or one you'd like to see.
title: "[Widget]: "
labels: ["widget", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Widgets are drop-a-folder plugins, see [docs/dev/writing-a-plugin.md](https://github.com/dmellok/tesserae/blob/main/docs/dev/writing-a-plugin.md) if you want to build it yourself. This template is for sketching one out before code.

  - type: input
    id: name
    attributes:
      label: Widget name
      placeholder: "Train departures"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: What does it show?
      description: One paragraph. What's on the screen, what problem does it solve.
    validations:
      required: true

  - type: input
    id: data-source
    attributes:
      label: Data source
      description: API name + URL, public/auth required, rate limits if you know them.
      placeholder: "PTV Timetable API (Melbourne), free, ~5 req/min per key"
    validations:
      required: true

  - type: dropdown
    id: sizes
    attributes:
      label: Target sizes
      multiple: true
      options:
        - xs (1 cell)
        - sm (2 cells)
        - md (4 cells)
        - lg (full-width or full-panel)
    validations:
      required: true

  - type: textarea
    id: layout
    attributes:
      label: Layout sketch
      description: ASCII, an image, or a description. Most useful with a rough proportion guide.
      placeholder: |
        ┌──────────────────────────┐
        │ STATION NAME             │
        ├──────────────────────────┤
        │ 14:32  Frankston    P1   │
        │ 14:41  Dandenong    P2   │
        └──────────────────────────┘

  - type: dropdown
    id: build-yourself
    attributes:
      label: Are you offering to build it?
      options:
        - "Yes, I'll send a PR"
        - "Maybe, if someone helps me get started"
        - "No, pitching the idea"
    validations:
      required: true
