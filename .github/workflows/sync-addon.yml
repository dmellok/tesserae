# Sync the companion HA Add-on repo.
#
# Two channels, two jobs:
#
# * **stable**: triggered on ``release: published`` + ``workflow_dispatch``.
#   Bumps ``tesserae/config.yaml`` to the release version. Fires when
#   ``gh release create vX.Y.Z --latest …`` runs; routine patch tags
#   that don't carry a Release do not churn the add-on.
#
# * **edge**: triggered on ``push: branches: [main]``.
#   Bumps ``tesserae-edge/config.yaml`` to ``<pyproject>-edge.<sha7>``.
#   The matching docker image tag is pushed by ``docker.yml`` on the
#   same main-push event, so HA Supervisor's pull always resolves.
#
# Both jobs push a single commit to
# https://github.com/dmellok/homeassistant-tesserae-addon via the
# ``ADDON_REPO_PAT`` secret (fine-grained PAT, Contents: read+write on
# the add-on repo only).

name: sync-addon

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to sync (stable channel; without leading 'v'). Defaults to the latest release."
        required: false

permissions:
  contents: read

concurrency:
  group: sync-addon-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Stable bump, release: published + workflow_dispatch.
  bump-stable:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
              version="${INPUT_VERSION#v}"
          else
              version="${RELEASE_TAG#v}"
          fi
          if [ -z "${version}" ]; then
              echo "::error::Couldn't resolve a version to sync"
              exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      - name: Check out add-on repo
        uses: actions/checkout@v6
        with:
          repository: dmellok/homeassistant-tesserae-addon
          token: ${{ secrets.ADDON_REPO_PAT }}
          path: addon
          fetch-depth: 0

      - name: Bump config.yaml + Dockerfile + CHANGELOG
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(version:[[:space:]]*\")[^\"]+(\".*)$/\1${VERSION}\2/" tesserae/config.yaml

          if [ -f tesserae/Dockerfile ]; then
              sed -i -E "s|(ghcr\.io/dmellok/tesserae:)[0-9A-Za-z._-]+|\1${VERSION}|g" tesserae/Dockerfile
          fi

          date_iso="$(date -u +'%Y-%m-%d')"
          entry="## ${VERSION}, ${date_iso}

          - Tracks Tesserae [${TAG}](https://github.com/dmellok/tesserae/releases/tag/${TAG}).

          "
          entry="$(printf '%s' "${entry}" | sed -E 's/^ {10}//')"

          python3 - <<PYEOF
          from pathlib import Path
          p = Path("tesserae/CHANGELOG.md")
          src = p.read_text(encoding="utf-8") if p.exists() else ""
          entry = """${entry}"""
          marker = "# Changelog\n"
          if marker in src:
              head, _, rest = src.partition(marker)
              rest = rest.lstrip("\n")
              p.write_text(head + marker + "\n" + entry + rest, encoding="utf-8")
          else:
              p.write_text("# Changelog\n\n" + entry + src, encoding="utf-8")
          PYEOF

      - name: Commit + push
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "tesserae-bot"
          git config user.email "[email protected]"
          git add tesserae/config.yaml tesserae/CHANGELOG.md
          [ -f tesserae/Dockerfile ] && git add tesserae/Dockerfile || true
          if git diff --cached --quiet; then
              echo "Add-on already at version ${VERSION}, nothing to commit."
              exit 0
          fi
          git commit -m "Track Tesserae ${TAG}

          Auto-synced by sync-addon.yml (stable channel).
          Release: https://github.com/dmellok/tesserae/releases/tag/${TAG}"
          git push
          echo "Bumped stable add-on to ${VERSION}."

  # Edge bump, push: branches: [main]. Tracks every main commit.
  bump-edge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tesserae core (for pyproject.toml + log subject)
        uses: actions/checkout@v6
        with:
          # Just the tip commit, we only need pyproject.toml + the
          # commit subject for the CHANGELOG entry.
          fetch-depth: 2

      - name: Resolve edge version
        id: ver
        env:
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Pyproject version is the "base" of the edge version string -
          # so an edge of 0.11.14-era main pushes resolves to
          # 0.11.14-edge.<sha7>. Matches the docker.yml edge-tag step.
          base="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')"
          sha="$(echo "${GITHUB_SHA_FULL}" | cut -c1-7)"
          edge_version="${base}-edge.${sha}"
          subject="$(git log -1 --pretty=format:'%s' "${GITHUB_SHA_FULL}")"
          # Escape backticks / quotes for safety later, leave most punctuation.
          echo "version=${edge_version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "subject<<SUBJ_EOF"
            echo "${subject}"
            echo "SUBJ_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved edge version=${edge_version} sha=${sha}"

      - name: Check out add-on repo
        uses: actions/checkout@v6
        with:
          repository: dmellok/homeassistant-tesserae-addon
          token: ${{ secrets.ADDON_REPO_PAT }}
          path: addon
          fetch-depth: 0

      - name: Bump tesserae-edge/config.yaml + CHANGELOG
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          SUBJECT: ${{ steps.ver.outputs.subject }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # If the edge directory doesn't exist yet, give up loudly -
          # we scaffold it manually once; the workflow doesn't try to
          # create it.
          if [ ! -d tesserae-edge ]; then
              echo "::warning::tesserae-edge/ not present on the add-on repo, skipping. Scaffold it first."
              exit 0
          fi

          sed -i -E "s/^(version:[[:space:]]*\")[^\"]+(\".*)$/\1${VERSION}\2/" tesserae-edge/config.yaml

          date_iso="$(date -u +'%Y-%m-%d')"
          # Single-line subject keeps the entry compact since edge ships
          # many commits per day.
          entry="## ${VERSION}, ${date_iso}

          - [\`${SHA}\`](https://github.com/dmellok/tesserae/commit/${FULL_SHA}) ${SUBJECT}

          "
          entry="$(printf '%s' "${entry}" | sed -E 's/^ {10}//')"

          python3 - <<PYEOF
          from pathlib import Path
          p = Path("tesserae-edge/CHANGELOG.md")
          src = p.read_text(encoding="utf-8") if p.exists() else ""
          entry = """${entry}"""
          marker = "# Changelog\n"
          if marker in src:
              head, _, rest = src.partition(marker)
              rest = rest.lstrip("\n")
              p.write_text(head + marker + "\n" + entry + rest, encoding="utf-8")
          else:
              p.write_text("# Changelog\n\n" + entry + src, encoding="utf-8")
          PYEOF

      - name: Commit + push
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          if [ ! -d tesserae-edge ]; then
              echo "No edge dir to commit, exiting cleanly."
              exit 0
          fi
          git config user.name "tesserae-bot"
          git config user.email "[email protected]"
          git add tesserae-edge/config.yaml tesserae-edge/CHANGELOG.md
          if git diff --cached --quiet; then
              echo "Edge add-on already at ${VERSION}, nothing to commit."
              exit 0
          fi
          git commit -m "edge: track Tesserae main @ ${SHA}

          Auto-synced by sync-addon.yml (edge channel).
          Commit: https://github.com/dmellok/tesserae/commit/${SHA}"
          git push
          echo "Bumped edge add-on to ${VERSION}."
