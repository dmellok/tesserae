# Sync the companion HA Add-on repo.
#
# Two channels, two jobs:
#
# * **stable**: triggered on ``release: published`` + ``workflow_dispatch``.
#   Bumps ``tesserae/config.yaml`` to the release version. Fires when
#   ``gh release create vX.Y.Z --latest …`` runs; routine patch tags
#   that don't carry a Release do not churn the add-on.
#
# * **edge**: triggered on ``push: branches: [main]``.
#   Bumps ``tesserae-edge/config.yaml`` to ``<pyproject>-edge.<sha7>``.
#   The matching docker image tag is pushed by ``docker.yml`` on the
#   same main-push event, so HA Supervisor's pull always resolves.
#
# Both jobs push a single commit to
# https://github.com/dmellok/homeassistant-tesserae-addon via the
# ``ADDON_REPO_PAT`` secret (fine-grained PAT, Contents: read+write on
# the add-on repo only).

name: sync-addon

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to sync (stable channel; without leading 'v'). Defaults to the latest release."
        required: false

permissions:
  contents: read

# Single lock across all event flavors. Cutting a release fires BOTH a
# release event (stable bump) and the matching push event (edge bump)
# ~2s apart; if they ran in parallel they'd both check out the add-on
# repo at the same SHA, race on push, and one would lose with
# "remote rejected: cannot lock ref". Serialising them via a shared
# group means stable bumps tesserae/, edge then rebases on top + bumps
# tesserae-edge/, both lands cleanly.
concurrency:
  group: sync-addon
  cancel-in-progress: false

jobs:
  # Stable bump, release: published + workflow_dispatch.
  bump-stable:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
              version="${INPUT_VERSION#v}"
          else
              version="${RELEASE_TAG#v}"
          fi
          if [ -z "${version}" ]; then
              echo "::error::Couldn't resolve a version to sync"
              exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      - name: Check out add-on repo
        uses: actions/checkout@v6
        with:
          repository: dmellok/homeassistant-tesserae-addon
          token: ${{ secrets.ADDON_REPO_PAT }}
          path: addon
          fetch-depth: 0

      - name: Bump config.yaml + Dockerfile + CHANGELOG
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(version:[[:space:]]*\")[^\"]+(\".*)$/\1${VERSION}\2/" tesserae/config.yaml

          if [ -f tesserae/Dockerfile ]; then
              sed -i -E "s|(ghcr\.io/dmellok/tesserae:)[0-9A-Za-z._-]+|\1${VERSION}|g" tesserae/Dockerfile
          fi

          # HA Supervisor surfaces this file under the add-on's
          # "Changelog" tab. We rewrite it to just the current
          # release every bump (rather than prepending history) so
          # users see "what's in the version I just upgraded to",
          # not a wall of every release this year. The host repo's
          # GitHub releases page holds the full history.
          date_iso="$(date -u +'%Y-%m-%d')"
          cat > tesserae/CHANGELOG.md <<EOF
          # Changelog

          ## ${VERSION}, ${date_iso}

          Tracks Tesserae [${TAG}](https://github.com/dmellok/tesserae/releases/tag/${TAG}).
          See the linked release notes for what changed.

          ---

          For the full release history, see
          [the Tesserae releases page](https://github.com/dmellok/tesserae/releases).
          EOF
          # Strip the 10-space leading indent the heredoc inherits
          # from the shell block.
          sed -i -E 's/^ {10}//' tesserae/CHANGELOG.md

      - name: Commit + push
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "tesserae-bot"
          git config user.email "[email protected]"
          git add tesserae/config.yaml tesserae/CHANGELOG.md
          [ -f tesserae/Dockerfile ] && git add tesserae/Dockerfile || true
          if git diff --cached --quiet; then
              echo "Add-on already at version ${VERSION}, nothing to commit."
              exit 0
          fi
          git commit -m "Track Tesserae ${TAG}

          Auto-synced by sync-addon.yml (stable channel).
          Release: https://github.com/dmellok/tesserae/releases/tag/${TAG}"
          # Pull-rebase before push: even with the workflow's
          # concurrency lock, the add-on repo can advance from a manual
          # edit or another workflow between checkout and push, retry
          # is cheap and covers that race. Track success explicitly so
          # a 3-fail run errors out rather than silently no-op-ing.
          pushed=0
          for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                  pushed=1
                  break
              fi
              echo "Push attempt ${attempt} failed, retrying..."
              sleep 2
          done
          if [ "${pushed}" -ne 1 ]; then
              echo "::error::Failed to push after 3 attempts"
              exit 1
          fi
          echo "Bumped stable add-on to ${VERSION}."

  # Edge bump, push: branches: [main]. Tracks every main commit.
  bump-edge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tesserae core (for pyproject.toml + log subject)
        uses: actions/checkout@v6
        with:
          # Just the tip commit, we only need pyproject.toml + the
          # commit subject for the CHANGELOG entry.
          fetch-depth: 2

      - name: Resolve edge version
        id: ver
        env:
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Pyproject version is the "base" of the edge version string -
          # so an edge of 0.11.14-era main pushes resolves to
          # 0.11.14-edge.<commit-unix-timestamp>. Matches the docker.yml
          # edge-tag step.
          #
          # v0.71.3: switched from <sha7> to unix commit time so the
          # suffix is monotonic and numeric. Semver compares alphanumeric
          # pre-release identifiers by ASCII order, which meant a commit
          # whose sha7 sorted below the previous one was seen as older
          # by HA Supervisor and looked already-installed.
          base="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')"
          sha="$(echo "${GITHUB_SHA_FULL}" | cut -c1-7)"
          ct="$(git log -1 --format='%ct' "${GITHUB_SHA_FULL}")"
          edge_version="${base}-edge.${ct}"
          subject="$(git log -1 --pretty=format:'%s' "${GITHUB_SHA_FULL}")"
          # Escape backticks / quotes for safety later, leave most punctuation.
          echo "version=${edge_version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "subject<<SUBJ_EOF"
            echo "${subject}"
            echo "SUBJ_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved edge version=${edge_version} sha=${sha}"

      - name: Check out add-on repo
        uses: actions/checkout@v6
        with:
          repository: dmellok/homeassistant-tesserae-addon
          token: ${{ secrets.ADDON_REPO_PAT }}
          path: addon
          fetch-depth: 0

      - name: Bump tesserae-edge/config.yaml + CHANGELOG
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          SUBJECT: ${{ steps.ver.outputs.subject }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # If the edge directory doesn't exist yet, give up loudly -
          # we scaffold it manually once; the workflow doesn't try to
          # create it.
          if [ ! -d tesserae-edge ]; then
              echo "::warning::tesserae-edge/ not present on the add-on repo, skipping. Scaffold it first."
              exit 0
          fi

          sed -i -E "s/^(version:[[:space:]]*\")[^\"]+(\".*)$/\1${VERSION}\2/" tesserae-edge/config.yaml

          # Edge ships many bumps per day, so we keep the changelog
          # to JUST the current edge build + a pointer to the host's
          # commit log for history. Same approach as the stable
          # channel, see the explanation in bump-stable.
          date_iso="$(date -u +'%Y-%m-%d')"
          cat > tesserae-edge/CHANGELOG.md <<EOF
          # Changelog

          ## ${VERSION}, ${date_iso}

          [\`${SHA}\`](https://github.com/dmellok/tesserae/commit/${FULL_SHA}) ${SUBJECT}

          ---

          Edge tracks the tip of \`main\` and updates on every commit; this
          file always shows just the latest edge build. For the full edge
          history, see
          [the Tesserae commit log](https://github.com/dmellok/tesserae/commits/main).
          EOF
          sed -i -E 's/^ {10}//' tesserae-edge/CHANGELOG.md

      - name: Commit + push
        working-directory: addon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          if [ ! -d tesserae-edge ]; then
              echo "No edge dir to commit, exiting cleanly."
              exit 0
          fi
          git config user.name "tesserae-bot"
          git config user.email "[email protected]"
          git add tesserae-edge/config.yaml tesserae-edge/CHANGELOG.md
          if git diff --cached --quiet; then
              echo "Edge add-on already at ${VERSION}, nothing to commit."
              exit 0
          fi
          git commit -m "edge: track Tesserae main @ ${SHA}

          Auto-synced by sync-addon.yml (edge channel).
          Commit: https://github.com/dmellok/tesserae/commit/${SHA}"
          # See the stable channel comment, retry with pull-rebase to
          # ride out any concurrent ref advance on the add-on repo.
          pushed=0
          for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                  pushed=1
                  break
              fi
              echo "Push attempt ${attempt} failed, retrying..."
              sleep 2
          done
          if [ "${pushed}" -ne 1 ]; then
              echo "::error::Failed to push after 3 attempts"
              exit 1
          fi
          echo "Bumped edge add-on to ${VERSION}."
