# Create a GitHub Release whenever a v* tag is pushed. Extracts the
# matching section from CHANGELOG.md so the Release body mirrors the
# curated release notes rather than the raw commit list.
#
# Never overwrites an existing Release: if one already exists for the
# tag (e.g. the maintainer hand-created it), the workflow logs and
# exits cleanly. Marks the Release as ``--latest`` so
# ``api.tesserae.ink/version/latest`` reflects it on the next poll.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed to trigger sync-addon.yml via workflow_dispatch below. A
  # ``release: published`` event created with the built-in GITHUB_TOKEN
  # does NOT trigger other workflows (GitHub's anti-recursion rule), so
  # the stable add-on sync would never fire on release. workflow_dispatch
  # + repository_dispatch are the documented exceptions that DO fire from
  # GITHUB_TOKEN, so we dispatch the sync explicitly.
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Extract this release's notes from CHANGELOG.md: everything from
          # the tag's own section down to (but excluding) the previous
          # release tag's section, so the body covers the whole span the
          # release actually ships rather than the last version bump alone.
          # Every version bump writes its own "## [x.y.z]" section, so a
          # release cut after 50 of them used to publish one bullet and drop
          # the rest.
          #
          # The tag's own header is skipped (the Release title already names
          # it); intermediate headers are kept so the body reads as a list of
          # versions. With no earlier tag to stop at (first release, or a tag
          # that sorts oddly) it falls back to the single-section behaviour.
          prev=$(git tag --list 'v*' --sort=-v:refname \
                 | awk -v t="$tag" 'f { print; exit } $0 == t { f=1 }')
          prev_marker=""
          if [ -n "$prev" ]; then prev_marker="[${prev#v}]"; fi
          awk -v ver="[$version]" -v prev="$prev_marker" '
            BEGIN { capture=0 }
            /^## \[/{
              if (capture) {
                if (prev == "" || index($0, prev) > 0) exit
                print; next
              }
              if (index($0, ver) > 0) { capture=1 }
              next
            }
            capture { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            printf "%s\n" "Release $tag." > release_body.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip if Release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.notes.outputs.tag }}" >/dev/null 2>&1; then
            echo "already-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.exists.outputs.already-exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release_body.md \
            --latest

      - name: Sync stable add-on
        # The release: published event above won't reach sync-addon.yml
        # (created by GITHUB_TOKEN), so trigger its stable job explicitly.
        # Runs whether or not we created the Release this run, so a
        # hand-created Release still bumps the add-on.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.notes.outputs.tag }}"
          version="${version#v}"
          gh workflow run sync-addon.yml --field version="${version}"
          echo "Dispatched stable add-on sync for ${version}."
