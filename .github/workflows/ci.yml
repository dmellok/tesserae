# Tesserae CI, runs ruff + pytest on every push and PR.
#
# Browser regressions run in a dedicated job with Chromium installed.

name: ci

# Prose-only changes don't run the Python matrix. A markdown edit used to run
# the whole suite three times (pytest and both forward-compat legs)
# for files no test imports. paths-ignore skips a run only when EVERY changed
# file matches, so a commit touching docs AND code still runs in full.
#
# Safe to skip rather than report because nothing here is a required status
# check (main has no branch protection). If that changes, a skipped required
# check blocks the merge for ever and the fix is a same-named no-op job, not
# removing this.
on:
  push:
    branches: [main]
    paths-ignore: &prose
      - "docs/**"
      - "notes/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore: *prose

# Cancel in-progress runs for the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        # Formatting drift breaks the build before it gets to review.
        # If this fails locally, run `ruff format` and commit.
        run: ruff format --check .

  lineups-browser:
    name: Lineups browser tests
    # Pinned: Playwright ships no Chromium for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: pytest (Chromium required)
        env:
          TESSERAE_REQUIRE_BROWSER_TESTS: "1"
        run: pytest -n 3 -q tests/test_lineups_browser.py

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        # -n auto fans the suite across the runner's vCPUs (pytest-xdist).
        # The suite is parallel-safe (tmp_path isolation, no shared ports).
        # Coverage deliberately does NOT run here: it is a weekly report-only
        # run (coverage.yml), since measuring it was the slowest job and the
        # one that lost its runner, and nothing gated on the number.
        # --timeout / --durations: the suite runs in ~5 min locally but one
        # worker occasionally goes silent for 70-100 min on the runner. A
        # test that passes 15 min now fails with its stack, and the slowest
        # tests are listed either way, so a stall names itself.
        run: nice -n 10 pytest -n auto -q --timeout=900 --durations=15

  pytest-forward:
    name: pytest (forward-compat)
    runs-on: ubuntu-latest
    # 3.12 and 3.13 run informationally: requires-python is >=3.11 and the
    # shipped runtime (Docker base, HA add-on) is 3.11. Failures surface as a
    # warning instead of blocking main. Promote to a required matrix once
    # consistently green. (3.13 moved here from the coverage job when that
    # left this workflow.)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: nice -n 10 pytest -n auto -q --timeout=900 --durations=15

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app + scanners
        # setuptools is upgraded with pip: the copy the interpreter ships is a
        # build tool nothing here imports, and it was the one finding left
        # once the runtime graph audited clean (#142).
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e . bandit pip-audit
      - name: bandit
        # Hard gate on high-severity, high-confidence findings only (0 today).
        # Lower-severity smells show up under `bandit -r app -ll` locally but
        # are too noisy to block the build on.
        run: bandit -r app -q --severity-level high --confidence-level high
      - name: pip-audit
        # A hard gate since #142: the pillow and cryptography advisories that
        # motivated it are resolved (pins lifted to <13 / <51, uv.lock on
        # pillow 12), and with setuptools upgraded above nothing else is
        # reported. A new advisory now fails the build until it is upgraded
        # past or ignored here with --ignore-vuln and a reason.
        # --skip-editable: the app itself is installed editable and isn't on
        # PyPI; auditing it asked pypi.org about "tesserae <version>", which
        # failed the job on a PyPI 503 (2026-10-20).
        run: pip-audit --progress-spinner off --skip-editable

  mypy:
    name: mypy (strict modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        # Only the contract modules are checked under --strict per the
        # pyproject overrides; plugin code passes default mypy.
        run: mypy app

  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    # ESLint and Prettier are required: static/ JS is clean of both. Stylelint
    # is still advisory (continue-on-error) while its baseline of duplicate
    # selectors is worked down; merging those can move rules in the cascade,
    # so each needs a look rather than a mechanical fix. The later steps run
    # even when ESLint fails, so all three report on every push.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install lint deps
        run: npm ci
      - name: eslint
        run: npm run lint:js
      - name: stylelint (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint:css
      - name: prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    # uv.lock is a reproducibility reference for the pip-installed runtime.
    # This fails if pyproject.toml changed without re-running `uv lock`, so the
    # pinned resolution can't silently drift from the declared dependencies.
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: uv lock --check
        run: uv lock --check

  mcp-bridge:
    name: mcp bridge
    runs-on: ubuntu-latest
    # The stdio bridge (packages/tesserae-mcp) is a self-contained sub-project
    # with its own pyproject + deps. Linting + testing it here keeps its tool
    # list / doc-shape in lockstep with the /api/mcp surface it wraps.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/tesserae-mcp[dev]"
      - name: ruff
        working-directory: packages/tesserae-mcp
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        working-directory: packages/tesserae-mcp
        run: pytest -q
