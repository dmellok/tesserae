# Tesserae CI, runs ruff + pytest on every push and PR.
#
# We don't install Playwright's browsers here. Tests that need the
# headless renderer should mock it (the renderer module imports fine
# without `playwright install`; failures only happen on actual
# browser launches).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        # Formatting drift breaks the build before it gets to review.
        # If this fails locally, run `ruff format` and commit.
        run: ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        # -n auto fans the suite across the runner's vCPUs (pytest-xdist).
        # The suite is parallel-safe (tmp_path isolation, no shared ports).
        # Coverage deliberately does NOT run here, see the `coverage` job.
        run: pytest -n auto -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Split out from `pytest` and pinned to 3.13 for one reason: speed.
    # coverage.py's default C tracer costs ~2.5x on this suite, which is what
    # made the blocking check a ~50 minute job. COVERAGE_CORE=sysmon puts it on
    # sys.monitoring (3.12+), which is close to free: measured locally at 8:29
    # (C tracer) vs 3:23-4:29 (sysmon), against a 3:24 no-coverage baseline.
    # `pytest` above keeps 3.11, the shipped runtime, so correctness is still
    # gated where it ships; only the coverage floor is measured on a newer
    # interpreter, at 83.69% when this split landed. Both jobs run in parallel,
    # so a green PR is gated by the slower of the two rather than by their sum.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest --cov
        # The floor sits just under the current ~82% so a genuine regression
        # fails the build while normal churn doesn't. Raise it as coverage
        # climbs.
        env:
          COVERAGE_CORE: sysmon
        run: pytest -n auto -q --cov=app --cov-report=term-missing --cov-fail-under=80

  pytest-forward:
    name: pytest (forward-compat)
    runs-on: ubuntu-latest
    # 3.12 / 3.13 run informationally: requires-python is >=3.11 and the
    # shipped runtime (Docker base, HA add-on) is 3.11. Failures surface as a
    # warning instead of blocking main. Promote to a required matrix once
    # these are consistently green.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest -n auto -q

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app + scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e . bandit pip-audit
      - name: bandit
        # Hard gate on high-severity, high-confidence findings only (0 today).
        # Lower-severity smells show up under `bandit -r app -ll` locally but
        # are too noisy to block the build on.
        run: bandit -r app -q --severity-level high --confidence-level high
      - name: pip-audit
        # Advisory. The pillow + cryptography advisories that motivated #142 are
        # resolved (pins lifted to <13 / <50). What remains is a minor transitive
        # advisory in click, which typer pins to <8.2 so it can't reach the fix
        # yet. Kept non-blocking so an unresolvable transitive doesn't red main;
        # promote to a hard gate once the runtime graph audits clean.
        continue-on-error: true
        run: pip-audit --progress-spinner off

  mypy:
    name: mypy (strict modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        # Only the contract modules are checked under --strict per the
        # pyproject overrides; plugin code passes default mypy.
        run: mypy app

  frontend-lint:
    name: frontend lint (advisory)
    runs-on: ubuntu-latest
    # Advisory: the hand-rolled static/ JS+CSS predates any linter, so ESLint /
    # Stylelint / Prettier run for visibility without blocking main. Each step
    # is continue-on-error so all three report independently. Baseline today is
    # small (ESLint ~36, Stylelint ~19, Prettier ~45 files); once worked down,
    # drop continue-on-error to make them required.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install lint deps
        run: npm ci
      - name: eslint
        continue-on-error: true
        run: npm run lint:js
      - name: stylelint
        continue-on-error: true
        run: npm run lint:css
      - name: prettier
        continue-on-error: true
        run: npm run format:check

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    # uv.lock is a reproducibility reference for the pip-installed runtime.
    # This fails if pyproject.toml changed without re-running `uv lock`, so the
    # pinned resolution can't silently drift from the declared dependencies.
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: uv lock --check
        run: uv lock --check

  mcp-bridge:
    name: mcp bridge
    runs-on: ubuntu-latest
    # The stdio bridge (packages/tesserae-mcp) is a self-contained sub-project
    # with its own pyproject + deps. Linting + testing it here keeps its tool
    # list / doc-shape in lockstep with the /api/mcp surface it wraps.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/tesserae-mcp[dev]"
      - name: ruff
        working-directory: packages/tesserae-mcp
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        working-directory: packages/tesserae-mcp
        run: pytest -q
