# Build the MkDocs wiki and deploy it to GitHub Pages.
#
# The widget gallery + compatibility pages are regenerated from the live
# manifests on every build, so they can't drift. Widget *screenshots* are
# committed artifacts (capture them locally with
# scripts/capture_widget_shots.py against a --dev instance), we don't run
# a browser in CI.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # MkDocs Material picks up template overrides from ``overrides/``
      # (configured via ``theme.custom_dir`` in mkdocs.yml). Without
      # this entry, edits to the PostHog snippet in main.html silently
      # skipped the docs deploy.
      - "overrides/**"
      - "mkdocs.yml"
      - "scripts/gen_*.py"
      - "plugins/**/plugin.json"
      - "renderers/**/renderer.json"
      - "devices/**/device.json"
      - "app/panel.py"
      - ".github/workflows/docs.yml"
  # Manual rebuild button on the Actions tab.
  workflow_dispatch:
  # Daily rebuild so changes to the community widget catalog (which
  # lives in a separate repo) pick up here within 24 h. The push
  # trigger only fires when this repo changes; without a schedule,
  # the community gallery would silently drift behind the catalog.
  schedule:
    - cron: "0 6 * * *"
  # Cross-repo trigger from the tesserae-widgets catalog. When a PR
  # merges there, its workflow can ``gh api repos/dmellok/tesserae/
  # dispatches`` with ``event_type: catalog_updated`` to refresh the
  # community gallery immediately rather than waiting for the daily
  # rebuild. The PAT for the catalog side lives there as a secret;
  # this side just listens.
  repository_dispatch:
    types: [catalog_updated]

# Allow the workflow to publish to Pages via the deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Regenerate auto pages from manifests
        run: |
          python scripts/gen_widget_gallery.py
          python scripts/gen_compatibility.py
          # Community gallery pulls the catalog's widgets.json from
          # GitHub. Tolerate a transient fetch failure here so a flaky
          # raw.githubusercontent.com doesn't fail the whole docs
          # build; the previously-committed copy stays in tree.
          python scripts/gen_community_gallery.py || echo "::warning::community gallery generation skipped (catalog fetch failed)"
      - name: Build site (strict)
        run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
