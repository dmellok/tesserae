<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.name|default("Compose") }}</title>
  <!-- Phosphor icon webfont — widgets reference icons via <i class="ph ph-xxx">
       (regular) or <i class="ph-bold ph-xxx"> (bold) or <i class="ph-fill ph-xxx">
       (fill, discouraged). The weight class + icon-name class form a compound
       selector — both classes carry the bare icon name. Vendored locally so the
       renderer paints without network access. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='icons/phosphor/regular/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='icons/phosphor/bold/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='icons/phosphor/fill/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='icons/phosphor/duotone/style.css') }}">
  <style>
    {{ page.font_face_css|safe }}

    html, body { margin: 0; padding: 0; }
    body {
      font-family: '{{ page.font_family }}', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: {{ page.bleed_color|default('#ffffff') }};
      color: {{ page.palette.fg }};
    }
    .panel {
      position: relative;
      width: {{ page.panel.w }}px;
      height: {{ page.panel.h }}px;
      overflow: hidden;
      background: {{ page.bleed_color|default('#ffffff') }};
    }
    .cell {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: {{ page.corner_radius }}px;
      /* Theme-aware widget boundary. On the Spectra 6 panel, near-white
         surfaces quantise to white — without this border widgets would
         visually merge into the panel. Outline lives inside the cell so it
         doesn't shrink the plugin's render area. */
      outline: 1px solid var(--theme-divider);
      outline-offset: -1px;

      /* Semantic token layer. Widgets paint from these --c-* tokens, NEVER
         the raw --theme-* primitives. Defined on the cell host so every
         widget's shadow inherits them regardless of which stylesheets it
         links. Two ideas kept apart that used to be conflated:
           - categorical (--c-data-*): "N distinguishable colours, no meaning"
           - status (--c-ok/warn/danger): "good / caution / bad"
         The categorical ramp tops out at ~4 hues on a 6-ink E6 panel;
         --c-accent-soft is the tonal lane (dithers — large fills only).
         See docs/widgets.md → "Theme tokens". */
      --c-bg:          var(--theme-bg);
      --c-surface:     var(--theme-surface);
      --c-raised:      var(--theme-surface2);
      --c-text:        var(--theme-fg);
      --c-text-soft:   var(--theme-fgSoft);
      --c-text-mute:   var(--theme-muted);
      --c-line:        var(--theme-divider);
      --c-accent:      var(--theme-accent);
      --c-accent-soft: var(--theme-accentSoft);
      --c-data-1:      var(--theme-accent);
      --c-data-2:      var(--theme-accent2);
      --c-data-3:      var(--theme-accent3);
      --c-data-4:      var(--theme-surface2);
      --c-ok:          var(--theme-ok);
      --c-warn:        var(--theme-warn);
      --c-danger:      var(--theme-danger);
      --c-info:        var(--theme-accent);
    }
    /* Per-cell zoom — the inner box paints into a 1/zoom virtual area
       then transform-scales back up to fill the cell, so widgets see a
       smaller container (both CSS via cqw/cqh AND JS via ctx.cell.w/h
       which composer.js divides by zoom). Container query unit lives
       here, not on .cell, so cqw/cqh reflect the *virtual* dims.
       --c-zoom defaults to 1 (no change) when no inline override is
       present. */
    /* --c-zoom is set on the parent .cell (inline style at first paint,
       postMessage patches thereafter). Don't declare a separate value
       on .cell-content — that would shadow the inherited one, since
       custom properties don't take "default" declarations; the var()
       fallback is the only way to express the 1.0 baseline. */
    .cell-content {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100% / var(--c-zoom, 1));
      height: calc(100% / var(--c-zoom, 1));
      transform: scale(var(--c-zoom, 1));
      transform-origin: top left;
      container-type: size;
    }
    .cell.full-bleed { outline: 0; }
    .cell.error { outline: 2px solid {{ page.palette.danger }}; }
    .cell--empty {
      background: repeating-linear-gradient(
        45deg,
        rgba(0,0,0,0.03) 0 12px,
        rgba(0,0,0,0.06) 12px 24px
      );
    }
    .cell-empty-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      gap: 4px;
      color: #888;
      font: 13px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    .cell-empty-placeholder strong { color: #555; display: block; }
  </style>
</head>
<body data-for-push="{{ '1' if for_push else '0' }}">
  <div class="panel">
    {% for cell in page.cells %}
    <div class="cell{% if cell.full_bleed %} full-bleed{% endif %}{% if not cell.plugin %} cell--empty{% endif %}"
         data-cell-id="{{ cell.id }}"
         data-cell-index="{{ loop.index }}"
         data-plugin="{{ cell.plugin }}"
         data-options='{{ cell.options|tojson }}'
         data-data='{{ cell.data|tojson }}'
         data-cell-w="{{ cell.w }}"
         data-cell-h="{{ cell.h }}"
         data-panel-w="{{ page.panel.w }}"
         data-panel-h="{{ page.panel.h }}"
         data-theme-palette='{{ cell.palette|tojson }}'
         data-font-family="{{ cell.font_family }}"
         data-cell-zoom="{{ cell.zoom }}"
         style="left: {{ cell.x }}px; top: {{ cell.y }}px; width: {{ cell.w }}px; height: {{ cell.h }}px;
                font-family: '{{ cell.font_family }}', system-ui, sans-serif;
                --theme-font: '{{ cell.font_family }}', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                --theme-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                --c-zoom: {{ cell.zoom }};
                {% for key, val in cell.palette.items() %}--theme-{{ key }}: {{ val }};{% endfor %}">
      <div class="cell-content">
        {% if not cell.plugin %}
        <div class="cell-empty-placeholder">
          <strong>Cell {{ loop.index }}</strong>
          <span>pick a widget</span>
        </div>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>

  {% if preview_mode %}
  <!-- Preview-mode overlay: per-cell number tag + click-to-edit shim.
       Tags absolutely positioned over each cell using inline styles so
       they stay aligned through the iframe's transform: scale. Clicking
       a cell sends a postMessage to the parent editor window. -->
  <style>
    .cell-tag {
      position: absolute;
      background: rgba(20, 16, 12, 0.85);
      color: #fff;
      font: 600 11px/1 system-ui, sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 9;
    }
    .cell-click-shim {
      position: absolute;
      cursor: pointer;
      z-index: 8;
      background: transparent;
      border: 0;
      padding: 0;
      transition: background 80ms ease, outline 80ms ease;
    }
    .cell-click-shim:hover {
      background: rgba(13, 140, 126, 0.16);
      outline: 2px solid var(--editor-accent, #0d8c7e);
      outline-offset: -2px;
    }
    .cell-click-shim.is-focused {
      outline: 3px solid var(--editor-accent, #0d8c7e);
      outline-offset: -3px;
    }
  </style>
  <div class="preview-tags">
    {% for cell in page.cells %}
    <div class="cell-tag" style="left: {{ cell.x + 6 }}px; top: {{ cell.y + 6 }}px;">
      {{ loop.index }} · {{ cell.plugin or 'unassigned' }}
    </div>
    <button class="cell-click-shim"
            type="button"
            data-cell-id="{{ cell.id }}"
            data-cell-index="{{ loop.index }}"
            style="left: {{ cell.x }}px; top: {{ cell.y }}px; width: {{ cell.w }}px; height: {{ cell.h }}px;"
            aria-label="Edit cell {{ loop.index }}"></button>
    {% endfor %}
  </div>
  <script>
    // Notify the editor (parent window) when a cell is clicked.
    document.querySelectorAll('.cell-click-shim').forEach((btn) => {
      btn.addEventListener('click', (ev) => {
        ev.preventDefault();
        try {
          window.parent.postMessage({
            type: 'tesserae-cell-clicked',
            cellId: btn.dataset.cellId,
            cellIndex: Number(btn.dataset.cellIndex),
          }, location.origin);
        } catch (e) { /* no parent */ }
      });
    });
    // Parent can post back which cell is currently focused; we mirror
    // the focused outline so the user knows which preview cell matches
    // their selected editor card.
    window.addEventListener('message', (ev) => {
      if (!ev.data || ev.data.type !== 'tesserae-focus-cell') return;
      document.querySelectorAll('.cell-click-shim').forEach((b) => {
        b.classList.toggle('is-focused', b.dataset.cellId === ev.data.cellId);
      });
    });
  </script>
  {% endif %}

  <script type="module" src="{{ url_for('static', filename='composer.js') }}"></script>
</body>
</html>
