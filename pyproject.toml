[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae"
version = "0.147.0"
description = "E-ink dashboard companion. Compose tile-based dashboards, render headless, push frames over MQTT."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "dmellok" }]
dependencies = [
    "flask>=3.0,<4",
    "pydantic>=2.6,<3",
    "jsonschema>=4.21,<5",
    "pillow>=10.2,<12",
    # HEIF / HEIC decoder, registered with Pillow at import time. iPhone
    # photos arrive HEIC by default; without this the picture_* widget
    # family falls through to "broken image" tiles whenever a library
    # holds an unprocessed HEIC asset. Wheel-bundled libheif on every
    # tier-1 platform (linux x86_64/arm64, macOS arm64), so this stays
    # pure pip with no system-package step.
    "pillow-heif>=0.22,<2",
    "numpy>=1.26,<3",
    "paho-mqtt>=2.0,<3",
    # Pinned to a minor: Playwright's Python client and the bundled
    # Chromium revision are coupled (the client looks for a specific
    # chromium_headless_shell-<rev>/ path at launch). The Docker base
    # image is mcr.microsoft.com/playwright/python:v1.60.0-noble; the
    # pip range here MUST match that minor or the container errors at
    # first render. Bump both together when upgrading.
    "playwright>=1.60,<1.61",
    "amqtt>=0.11,<1",
    # icalendar + recurring_ical_events power the calendar_* widgets.
    # Both pure-Python, depend transitively on python-dateutil, and
    # give us correct RRULE / EXDATE expansion without us reinventing
    # RFC 5545.
    "icalendar>=5.0,<7",
    "recurring-ical-events>=2.1,<4",
    # Safe XML parsing for the calendar_core CalDAV discovery PROPFIND
    # (enumerating a self-hosted server's calendar / todo collections).
    # Pure-Python, no transitive deps; guards the multistatus parse
    # against entity-expansion attacks that stdlib ElementTree doesn't.
    "defusedxml>=0.7,<1",
    # Production WSGI server, Flask's built-in run() is dev-only and
    # prints a "DO NOT USE IN PRODUCTION" banner on every startup.
    # Waitress is pure-Python, cross-platform, and tuned-by-default for
    # the single-user appliance Tesserae targets.
    "waitress>=3.0,<4",
    # Bundled IANA tz database so zoneinfo (scheduler + the timezone
    # picker) has a complete, consistent zone list on any host OS.
    "tzdata",
    # AES-GCM at-rest encryption for manifest-declared secret fields
    # (HA tokens, plugin API keys, etc.). PyCA cryptography is the de
    # facto Python crypto library; Rust-backed primitives, well-audited,
    # available as a manylinux wheel so the Docker image stays slim.
    "cryptography>=42,<46",
    # Optional mDNS advertiser (Settings → opt-in): publishes
    # tesserae.local + an _http._tcp service so the appliance is
    # reachable by name without touching the host's hostname.
    "zeroconf>=0.130,<1",
    # Pure-Python QR code generator (no transitive deps, ~50 KB).
    # Used by the recipes widget to render a scannable link back to
    # the source recipe page in the card's bottom-right corner.
    "segno>=1.6,<2",
]

[project.scripts]
# `tesserae` runs the production waitress server. `tesserae --dev`
# opts into Flask's reload + debugger dev server.
tesserae = "app.main:_serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # Parallel test execution (`pytest -n auto`), local and in CI. The suite
    # is tmp_path-isolated with no shared ports, so it's parallel-safe.
    "pytest-xdist>=3.5",
    "mypy>=1.9",
    # Pinned to a minor range: ruff ships new lint rules in minor bumps,
    # which would otherwise break CI on an unrelated upgrade. Bump
    # deliberately + run `ruff check` / `ruff format` when you do.
    "ruff>=0.15,<0.16",
    "types-jsonschema",
]
docs = [
    # MkDocs Material builds the public wiki at docs/ -> GitHub Pages.
    # The gen_* scripts under scripts/ produce the auto-generated pages
    # (widget gallery, hardware compatibility) from the live manifests.
    "mkdocs-material>=9.5,<10",
    # Click-to-zoom lightbox for the widget gallery + screenshots.
    "mkdocs-glightbox>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "plugins*", "renderers*", "devices*", "tests*"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
# ``packages/`` holds self-contained sub-projects (the tesserae-mcp bridge)
# with their own pyproject + ruff config and their own CI job; the app's ruff
# run skips them so the two rule sets don't fight.
extend-exclude = ["data", "static/dist", "node_modules", "packages"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by formatter
    # We deliberately use × (dimensions, e.g. 1600×1200) and – (en-dash
    # ranges) in UI copy + docstrings; these flag intentional typography.
    "RUF001",   # ambiguous unicode in strings
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Strict on the load-bearing contract modules. Everything else uses defaults.
[[tool.mypy.overrides]]
module = [
    "app.state.*",
    "app.push",
    "app.plugin_loader",
    "app.renderer_loader",
    "app.device_loader",
    "app.renderer",
]
strict = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests", "plugins", "renderers", "devices"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:flask.*",
]
