      description: Metadata only; raw snapshot values are never returned here
      type: object
      additionalProperties: false
      required: [source_id, state, generated_at, stale_at, expires_at]
      properties:
        source_id:
          $ref: "#/components/schemas/PersonalDataSourceID"
        state:
          $ref: "#/components/schemas/PersonalDataFreshness"
        generated_at:
          type: string
          format: date-time
        stale_at:
          description: >-
            Server-computed generated_at plus the advertised stale interval.
            State is stale at or after this time and before expires_at.
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    PersonalDataStatusResponse:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PersonalDataSourceStatus"
    DevicesResponse:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Device:
      type: object
      additionalProperties: false
      required: [id, name, kind, icon, panel, freshness]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        icon:
          description: >-
            Bare Phosphor icon name resolved from the device kind or its
            per-instance override.
          type: string
        panel:
          $ref: "#/components/schemas/Panel"
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        rssi_dbm:
          type: integer
          nullable: true
        firmware_version:
          type: string
          nullable: true
        capability_support:
          description: >-
            Server-computed support states keyed by protocol capability rather
            than device model. A server advertising gallery includes a
            frame_cache entry so Gallery and future Album surfaces can present
            supported, unsupported, and unknown targets consistently. Clients
            must not infer support from an SD-card model list.
          allOf:
            - $ref: "#/components/schemas/DeviceCapabilitySupportMap"
        has_pending_render:
          type: boolean
          description: >-
            True when a REST polling device has not yet fetched the server's
            latest render. False for transports without a reliable served
            signal. Absent on older compatible servers.
        pending_render:
          allOf:
            - $ref: "#/components/schemas/PendingRender"
          description: >-
            Exact newer frame waiting for this REST polling display. Absent
            when no retained pending preview exists or on older compatible
            servers.
    PendingRender:
      type: object
      additionalProperties: false
      required: [revision, preview_url]
      properties:
        revision:
          type: string
        rendered_at:
          type: string
          format: date-time
          nullable: true
        preview_url:
          type: string
          description: Authenticated Companion path for this exact revision.
    DeviceCapabilitySupportMap:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: "#/components/schemas/DeviceCapabilitySupport"
    DeviceCapabilitySupport:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          description: >-
            supported only when the latest usable device report advertises the
            capability; unsupported when a usable report explicitly lacks it;
            unknown when the server has no usable current report.
          type: string
          enum: [supported, unsupported, unknown]
        reason_code:
          description: >-
            Optional stable machine-readable explanation. Clients localize
            known values and use a generic explanation for unknown future
            values. Initial values are not_advertised, no_usable_heartbeat,
            and stale_heartbeat. A stale heartbeat produces unknown with a
            non-null observed_at; its age threshold follows the device's poll
            cadence rather than a client-defined fixed interval.
          type: string
          minLength: 1
          maxLength: 80
        observed_at:
          description: Time of the device report used for this computed state
          type: string
          format: date-time
          nullable: true
