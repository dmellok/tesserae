    GalleryFolderCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: >-
            User-entered folder name. The server validates and normalizes it
            into the Gallery's storage name; the returned GalleryFolder.name
            is authoritative and can differ from this request. The client
            never constructs an id or path from either value.
          type: string
          minLength: 1
          maxLength: 80
    GalleryFolder:
      type: object
      additionalProperties: false
      required: [id, name, kind, writable, image_count, cover_thumbnail_url]
      properties:
        id:
          description: Opaque stable folder identifier, never a host path
          type: string
          minLength: 1
          maxLength: 256
        name:
          description: >-
            Authoritative server name also shown by Tesserae Web. For a newly
            created internal folder this is its normalized storage name; for
            example, Summer 2026! can return summer-2026. Special server-owned
            folders may use their canonical label. The value is not a host
            path.
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [internal, external]
        writable:
          description: >-
            Server-computed write eligibility. External folders are false in
            contract 0.12.0; future policy must not be inferred from kind alone.
          type: boolean
        image_count:
          type: integer
          minimum: 0
        cover_thumbnail_url:
          description: Relative authenticated thumbnail URL, or null when empty
          type: string
          nullable: true
    GalleryImageResponse:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          $ref: "#/components/schemas/GalleryImage"
    GalleryImage:
      type: object
      additionalProperties: false
      required:
        - id
        - folder_id
        - name
        - content_type
        - bytes
        - width
        - height
        - etag
        - thumbnail_url
        - content_url
      properties:
        id:
          description: Opaque stable image identifier, never a filename or path
          type: string
          minLength: 1
          maxLength: 512
        folder_id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          description: Safe server-selected display filename; not resource identity
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: >-
            Media type of the server-owned stored image. It can differ from
            the accepted upload type; HEIC and HEIF uploads are normalized to
            JPEG before they enter the Gallery.
          allOf:
            - $ref: "#/components/schemas/GalleryStoredContentType"
        bytes:
          type: integer
          minimum: 1
        width:
          description: Pixel width after the server bakes source orientation
          type: integer
          minimum: 1
        height:
          description: Pixel height after the server bakes source orientation
          type: integer
          minimum: 1
        etag:
          description: Validator for both content and derived thumbnail caching
          type: string
          minLength: 1
        thumbnail_url:
          type: string
        content_url:
          type: string
        created_at:
          description: Server import time when available
          type: string
          format: date-time
          nullable: true
    GalleryUploadContentType:
      description: Source media type accepted by Gallery upload
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/heic
        - image/heif
        - image/webp
    GalleryImageContentType:
      description: >-
        Deprecated 0.11 combined name retained for generated-client source
        compatibility. New clients use GalleryUploadContentType for accepted
        sources and GalleryStoredContentType for returned resources.
      deprecated: true
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/heic
        - image/heif
        - image/webp
    GalleryStoredContentType:
      description: Media type that an existing normalized Gallery file can expose
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
        - image/bmp
    ImagePushRequest:
      type: object
      additionalProperties: false
      required: [device_ids, fit, override_quiet_hours]
      properties:
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        framing:
          description: >-
            Optional server-resolved composition intent. It is accepted only
            with fit=fill and when image_framing is advertised. The same intent
            is resolved independently for every target panel, so mixed target
            aspect ratios do not share one fixed crop rectangle. Omit it for
            the existing centered Fill behavior.
          allOf:
            - $ref: "#/components/schemas/ImageFraming"
        override_quiet_hours:
          type: boolean
          default: false
    ImageFraming:
      description: >-
        Normalized subject framing resolved independently for each target. The
        server applies EXIF orientation before interpreting these coordinates,
        so source_width/source_height and focus_x/focus_y all refer to the
        orientation-normalized image as displayed. Let source_aspect be
        source_width/source_height and target_aspect be
        target_width/target_height. Ordinary Fill exposes a normalized source
        crop of target_aspect/source_aspect by 1 when the source is wider than
        the target, otherwise 1 by source_aspect/target_aspect. Divide both crop
        dimensions by zoom, center that rectangle on focus_x/focus_y, then
        clamp its origin so the rectangle remains inside [0,1]. The resulting
        rectangle feeds the server's SourceCrop primitive before the existing
        Fill operation. Pixel rounding and the minimum non-empty crop remain
        server-owned.
      type: object
      additionalProperties: false
      required: [focus_x, focus_y, zoom]
      properties:
        focus_x:
          description: >-
            Horizontal subject focus in normalized, EXIF-orientation-normalized
            source-image space
          type: number
          minimum: 0
          maximum: 1
        focus_y:
          description: >-
            Vertical subject focus in normalized, EXIF-orientation-normalized
            source-image space
          type: number
          minimum: 0
          maximum: 1
        zoom:
          description: >-
            Scale relative to the minimum Fill scale. 1 is ordinary Fill;
            larger values crop more tightly and must not exceed the server's
            advertised limits.image_framing_max_zoom.
          type: number
          minimum: 1
    RemoteSourceURL:
      description: >-
        Absolute HTTP(S) URL without embedded credentials. Companion-triggered
        fetches use a strict public-network policy: private, loopback,
        link-local, reserved, unspecified, and equivalent redirect destinations
        are refused. The client cannot override that policy.
      type: string
      format: uri
      minLength: 8
      maxLength: 4096
      pattern: "^https?://[^\\s]+$"
    ImageURLPushRequest:
      type: object
      additionalProperties: false
      required: [url, device_ids, fit, override_quiet_hours]
      properties:
        url:
          $ref: "#/components/schemas/RemoteSourceURL"
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        override_quiet_hours:
          type: boolean
          default: false
    WebpagePushRequest:
      type: object
      additionalProperties: false
      required: [url, device_ids, fit, override_quiet_hours]
      properties:
        url:
          $ref: "#/components/schemas/RemoteSourceURL"
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        viewport_w:
          description: >-
            Optional advanced logical browser width. The server defaults to
            1280 and owns the logical capture height. It renders once at that
            logical size and does not re-render for each target display.
          type: integer
          minimum: 200
          maximum: 4096
          default: 1280
        override_quiet_hours:
          type: boolean
          default: false
    ImageFitMode:
      type: string
      enum: [fit, fill, blur, stretch, center]
    LineupsResponse:
      type: object
      additionalProperties: false
      required: [lineups]
      properties:
        lineups:
          type: array
          items:
            $ref: "#/components/schemas/Lineup"
    LineupResponse:
      type: object
      additionalProperties: false
      required: [lineup]
      properties:
        lineup:
          $ref: "#/components/schemas/Lineup"
    LineupCreateRequest:
      description: >-
        Intent selects the server-owned native builder. Daily and interval use
        exactly one page; cycle and manual accept an ordered list. The server
        validates all referenced Dashboard and Display identifiers.
      type: object
      additionalProperties: false
      required: [intent, name, page_ids]
      properties:
        intent:
          type: string
          enum: [daily, interval, cycle, manual]
        name:
          type: string
          minLength: 1
        page_ids:
          type: array
          minItems: 1
          items:
            type: string
        device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        dwell_minutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10080
        interval_minutes:
          type: integer
          minimum: 1
          maximum: 10080
        fires_at:
          $ref: "#/components/schemas/LocalTime"
        anchor:
          $ref: "#/components/schemas/LocalTime"
        bind_unassigned_dashboards:
          description: >-
            When true, assign selected Dashboards with no existing binding to
            the first selected Display. Never moves a Dashboard already bound
            elsewhere.
          type: boolean
          default: false
    LineupPatchRequest:
      description: >-
        Partial native edit. Omitted fields retain their stored values; intent
        and advanced fields are deliberately not writable through this route.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        page_ids:
          type: array
          minItems: 1
          items:
            type: string
        dwell_minutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10080
        interval_minutes:
          type: integer
          minimum: 1
          maximum: 10080
        fires_at:
          $ref: "#/components/schemas/LocalTime"
        anchor:
          $ref: "#/components/schemas/LocalTime"
    Lineup:
      description: >-
        Public read projection of the server's unified Deck model. Fields through
        anchor match the v0.289.2 implementation. The remaining scheduling and
        navigation fields are additive 0.8 contract requirements so an advanced
        Lineup remains fully describable when native_editable is false. The
        internal legacy_kind migration marker is intentionally not public.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - enabled
        - intent
        - device_ids
        - resolved_device_ids
        - dashboards
        - current
        - next_advance_epoch
        - advance
        - trigger
        - interval_minutes
        - fires_at
        - anchor
        - entry_page_id
        - home_page_id
        - home_timeout_minutes
        - refresh_interval_minutes
        - end_at
        - days_of_week
        - priority
        - smart_sync
        - smart_sync_lead_seconds
        - mode
        - min_hold_minutes
        - window_start
        - window_end
        - fallback_page_id
        - native_editable
        - requires_web_reason
        - web_url
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_][a-z0-9_-]*$"
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        intent:
          description: >-
            Server-computed mapping to the four user-facing wizard intents, or
            null when the stored trigger cannot be represented by one of them.
          type: string
          enum: [daily, interval, cycle, manual]
          nullable: true
        device_ids:
          description: Explicit displays authored on this Lineup; may be empty
          type: array
          uniqueItems: true
          items:
            type: string
        resolved_device_ids:
          description: >-
            Server-computed displays an action may touch. Uses device_ids when
            present, otherwise the union of member Dashboard bindings.
          type: array
          uniqueItems: true
          items:
            type: string
        dashboards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineupDashboard"
        current:
          description: Per-display navigation state; bound displays may differ
          type: array
          items:
            $ref: "#/components/schemas/LineupCurrent"
        next_advance_epoch:
          description: Next scheduled advance as Unix epoch seconds, when known
          type: integer
          format: int64
          nullable: true
        advance:
          type: string
          enum: [manual, timer, both]
        trigger:
          type: string
          enum: [cycle, interval, daily]
          nullable: true
        interval_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          nullable: true
        fires_at:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        anchor:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        entry_page_id:
          type: string
          nullable: true
        home_page_id:
          type: string
          nullable: true
        home_timeout_minutes:
          type: integer
          minimum: 0
          maximum: 120
        refresh_interval_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        end_at:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        days_of_week:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        priority:
          type: integer
        smart_sync:
          type: boolean
        smart_sync_lead_seconds:
          type: integer
          minimum: 0
          maximum: 600
        mode:
          type: string
          enum: [scheduled, priority]
        min_hold_minutes:
          type: integer
          minimum: 0
          maximum: 120
        window_start:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        window_end:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        fallback_page_id:
          type: string
          nullable: true
        native_editable:
          description: Server-computed; false makes the definition read/control-only
          type: boolean
        requires_web_reason:
          description: Human-readable reason native editing is unavailable
          type: string
          nullable: true
        web_url:
          description: Relative URL for editing this Lineup in Tesserae Web
          type: string
    LocalTime:
      type: string
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
    LineupDashboard:
      type: object
      additionalProperties: false
      required:
        - page_id
        - name
        - dwell_minutes
        - missing
        - refresh_interval_minutes
        - links
        - conditions
      properties:
        page_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        dwell_minutes:
          description: Effective dwell after applying the Lineup default
          type: integer
          minimum: 1
          maximum: 10080
        missing:
          description: True when the referenced Dashboard has been deleted
          type: boolean
        refresh_interval_minutes:
          description: Raw per-Dashboard override; null inherits the Lineup default
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        links:
          type: array
          items:
            $ref: "#/components/schemas/LineupLink"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/LineupCondition"
    LineupCurrent:
      type: object
      additionalProperties: false
      required: [device_id, page_id]
      properties:
        device_id:
          type: string
        page_id:
          type: string
    LineupLink:
      description: Exactly one of button or zone is non-null
      type: object
      additionalProperties: false
      required: [target_page_id, button, zone]
      properties:
        target_page_id:
          type: string
          minLength: 1
        button:
          type: string
          nullable: true
        zone:
          allOf:
            - $ref: "#/components/schemas/LineupZone"
          nullable: true
    LineupZone:
      type: object
      additionalProperties: false
      required: [x, y, w, h]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        w: {type: number, minimum: 0.000001, maximum: 1}
        h: {type: number, minimum: 0.000001, maximum: 1}
    LineupCondition:
      description: >-
        One upstream condition tuple. value remains structurally open because
        its shape is selected by source_kind and operator; clients must preserve
        unknown additive condition forms when rendering a read-only summary.
      type: object
      additionalProperties: false
      required: [source_kind, source_id, operator, value]
      properties:
        source_kind:
          type: string
          enum: [ha_entity, time_window, sun]
        source_id:
          type: string
        operator:
          type: string
        value:
          nullable: true
    LineupActionRequest:
      description: >-
        State actions return 200 with the updated Lineup. Paint actions return
        202 with a Job; play requires page_id from this Lineup, while next and
        previous omit page_id. device_ids, when present, must be bound to it.
      oneOf:
        - $ref: "#/components/schemas/LineupStateActionRequest"
        - $ref: "#/components/schemas/LineupPaintActionRequest"
    LineupStateActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [enable, disable]
    LineupPaintActionRequest:
      type: object
      additionalProperties: false
      required: [action, override_quiet_hours]
      properties:
        action:
          type: string
          enum: [next, previous, play]
        page_id:
          type: string
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        override_quiet_hours:
          type: boolean
          default: false
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [items, next_before_id]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        next_before_id:
          description: Opaque cursor for the next older page, or null at the end
          type: string
          nullable: true
    HistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - source
        - label
        - device_ids
        - status
        - preview_available
        - resendable
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        source:
          description: Stable server source identifier, additive over time
          type: string
        label:
          type: string
        device_ids:
          description: Snapshot of the original delivery targets
          type: array
          uniqueItems: true
          items:
            type: string
        status:
          description: Stable push outcome identifier, additive over time
          type: string
        duration_seconds:
          type: number
          minimum: 0
          nullable: true
        error:
          type: string
          nullable: true
        preview_available:
          type: boolean
        resendable:
          type: boolean
        fit:
          description: Original image fit mode when the source was arbitrary media
          allOf:
            - $ref: "#/components/schemas/ImageFitMode"
          nullable: true
        framing:
          description: >-
            Original normalized framing intent when the image was sent with
            image_framing. It is returned for reproduction or re-targeting.
            Resolved per-target crop rectangles are derived server-internal
            state rather than part of the public History contract.
          allOf:
            - $ref: "#/components/schemas/ImageFraming"
          nullable: true
    HistoryResendRequest:
      type: object
      additionalProperties: false
      required: [override_quiet_hours]
      properties:
        override_quiet_hours:
          type: boolean
          default: false
    JobResponse:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - target_device_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - dashboard_push
            - image_push
            - image_url_push
            - webpage_push
            - history_resend
            - lineup_action
        status:
          description: Execution lifecycle only; quiet is a successful result
          type: string
          enum: [accepted, running, succeeded, failed]
        label:
          type: string
          nullable: true
        target_device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          allOf:
            - $ref: "#/components/schemas/JobResult"
          nullable: true
        error:
          allOf:
            - $ref: "#/components/schemas/JobFailure"
          nullable: true
    JobResult:
      type: object
      additionalProperties: false
      required: [status, device_ids]
      properties:
        status:
          type: string
          enum: [published, quiet]
        reason:
          type: string
          nullable: true
        device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        history_event_ids:
          description: >-
            Optional exact correlation to canonical History rows produced by
            this job. Clients may otherwise refresh History after termination.
          type: array
          uniqueItems: true
          items:
            type: string
    JobFailure:
      description: >-
        Stable failure details. URL-backed Jobs should distinguish policy
        refusal, fetch failure, render failure, and temporary renderer
        unavailability with safe machine-readable codes.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - pairing_expired
                - pairing_code_used
                - invalid_target
                - invalid_framing
                - invalid_snapshot
                - unsupported_personal_data_source
                - snapshot_out_of_order
                - snapshot_conflict
                - unsupported_image
                - image_too_large
                - url_blocked
                - idempotency_conflict
                - resource_conflict
                - not_resendable
                - temporarily_unavailable
                - precondition_failed
            message:
              type: string
            request_id:
              type: string
              nullable: true
security:
  - CompanionBearer: []
