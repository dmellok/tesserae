openapi: 3.0.3
info:
  title: Tesserae Companion API
  version: 0.12.0
  description: >-
    Companion API contract for community-built clients. Previews, History,
    resend, remote-image push, webpage push, and server-advertised image fit
    modes are optional additive extensions over the five-feature compatibility
    floor. Image framing and the privacy-preserving personal-data snapshot
    bridge are independently capability-gated additive extensions. New
    Reminders clients require `reminders` in `personal_data.sources`; they do
    not infer generic support from the legacy feature flag or fall back to
    `reminders.fridge`. Apple Health clients require both the separate
    `personal_data_health` feature and `health.summary` source advertisement.
    Native Gallery browsing, internal-folder creation, and one-image-at-a-time
    upload are gated independently from image push and from future destructive
    Gallery management or Offline Album authoring.
servers:
  - url: /
tags:
  - name: Discovery
  - name: Pairing
  - name: Displays
  - name: Dashboards
  - name: Images
  - name: Gallery
  - name: Webpages
  - name: Jobs
  - name: Lineups
  - name: History
  - name: Personal Data
paths:
  /api/app/v1:
    get:
      tags: [Discovery]
      operationId: getCompanionCapabilities
      summary: Probe Companion API support without exposing household content
      security: []
      responses:
        "200":
          description: Supported capabilities and current resource limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/app/v1/pair:
    post:
      tags: [Pairing]
      operationId: pairCompanion
      summary: Exchange a single-use Companion code for a client credential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: Credential returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/session:
    get:
      tags: [Pairing]
      operationId: getCompanionSessionAuthorization
      summary: Read the presented credential's current optional permissions
      description: >-
        Returns current scopes after an operator changes an optional grant in
        Tesserae Settings. Advertised by the session_read capability. Clients
        may fall back to save-time 403 handling on older authoring servers.
      responses:
        "200":
          description: Current credential identity and scopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionSessionAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Pairing]
      operationId: revokeCompanionSession
      summary: Revoke the presented Companion credential
      responses:
        "204":
          description: Credential revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/personal-data/status:
    get:
      tags: [Personal Data]
      operationId: getCompanionPersonalDataStatus
      summary: List snapshot freshness metadata without returning personal values
      description: >-
        Returns only source identifiers and timestamps. Snapshot payload values
        are intentionally unavailable through the Companion read surface.
      responses:
        "200":
          description: Metadata for currently stored or expired snapshot sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/app/v1/personal-data/{source_id}:
    parameters:
      - $ref: "#/components/parameters/PersonalDataSourceID"
    put:
      tags: [Personal Data]
      operationId: putCompanionPersonalDataSnapshot
      summary: Replace the latest snapshot for one advertised personal-data source
      description: >-
        Validates and atomically replaces the source's latest snapshot. This
        synchronous storage operation does not render a dashboard, publish to a
        display, create a Job, or write History. A retry with the same generated
        timestamp and payload is idempotent; an older snapshot or conflicting
        payload at the same timestamp is refused so delayed background work
        cannot replace newer data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalDataSnapshot"
      responses:
        "200":
          description: Snapshot accepted as the source's latest value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataSourceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Personal Data]
      operationId: deleteCompanionPersonalDataSnapshot
      summary: Delete the latest snapshot when its source is disabled
      description: >-
        Idempotently removes the raw snapshot immediately. Previously rendered
        compositions remain governed by the existing render-cache and History
        policy and are not personal-data snapshot records.
      responses:
        "204":
          description: Snapshot absent after the request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/app/v1/devices:
    get:
      tags: [Displays]
      operationId: listCompanionDevices
      summary: List stable display targets and lightweight status
      responses:
        "200":
          description: Displays visible to the Companion role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/app/v1/devices/{device_id}/preview:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Displays]
      operationId: getCompanionDevicePreview
      summary: Read the device's last-served or exact pending preview
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - in: query
          name: revision
          required: false
          description: >-
            Exact pending-render revision advertised by the devices list.
            Omit it to read the display's last-served preview.
          schema:
            type: string
      responses:
        "200":
          description: >-
            With revision, the exact retained pending PNG. Without revision,
            for REST polling devices, the last viewable PNG served through the
            device frame endpoint after image fit and device geometry have
            been applied. Other transports fall back to the latest server
            render. Renderer-specific palette and quantisation should be
            represented when a reusable PNG can be produced from that stage.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The cached device preview is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/dashboards:
    get:
      tags: [Dashboards]
      operationId: listCompanionDashboards
      summary: List dashboards without forcing preview renders
      responses:
        "200":
          description: Saved dashboards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/app/v1/dashboards/{dashboard_id}/preview:
    parameters:
      - $ref: "#/components/parameters/DashboardID"
    get:
      tags: [Dashboards]
      operationId: getCompanionDashboardPreview
      summary: Read or asynchronously prepare a cached dashboard preview
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - in: query
          name: device_id
          required: false
          description: Optional target display whose panel dimensions should be used
          schema:
            type: string
      responses:
        "200":
          description: Cached dashboard composition PNG
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "202":
          description: A background preview render has been accepted
          headers:
            Retry-After:
              description: Suggested retry delay in seconds
              schema:
                type: integer
                minimum: 1
        "304":
          description: The cached composition is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/dashboards/{dashboard_id}/push:
    parameters:
      - $ref: "#/components/parameters/DashboardID"
    post:
      tags: [Dashboards]
      operationId: pushCompanionDashboard
      summary: Render a dashboard for its bindings or explicit targets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardPushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/images:
    post:
      tags: [Images]
      operationId: pushCompanionImage
      summary: Send one still image to explicit display targets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, request]
              properties:
                image:
                  type: string
                  format: binary
                request:
                  $ref: "#/components/schemas/ImagePushRequest"
            encoding:
              request:
                contentType: application/json
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Encoded or decoded image exceeds advertised limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported still-image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/app/v1/gallery/folders:
    get:
      tags: [Gallery]
      operationId: listCompanionGalleryFolders
      summary: List Gallery folders without exposing host filesystem paths
      description: >-
        Requires gallery:read and the gallery feature. Internal and external
        folders share the same read model; writable is computed by the server.
      responses:
        "200":
          description: Gallery folder summaries in server-defined display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryFoldersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Gallery]
      operationId: createCompanionGalleryFolder
      summary: Create one writable internal Gallery folder
      description: >-
        Requires gallery:write and the gallery feature. The server validates
        and normalizes the requested display name, creates only an internal
        folder, and returns its opaque stable identifier. Companion cannot link
        an external host path through this surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryFolderCreateRequest"
      responses:
        "201":
          description: Internal folder created with an empty image list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryFolderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/gallery/folders/{folder_id}:
    parameters:
      - $ref: "#/components/parameters/GalleryFolderID"
    get:
      tags: [Gallery]
      operationId: getCompanionGalleryFolder
      summary: Read one Gallery folder and its images
      description: >-
        Requires gallery:read and the gallery feature. Image order is the
        server's canonical folder order; no host filesystem path is returned.
      responses:
        "200":
          description: Folder metadata and image resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryFolderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/gallery/folders/{folder_id}/images:
    parameters:
      - $ref: "#/components/parameters/GalleryFolderID"
    post:
      tags: [Gallery]
      operationId: uploadCompanionGalleryImage
      summary: Upload one still image into a writable Gallery folder
      description: >-
        Requires gallery:write and the gallery feature. Each request contains
        exactly one image and has its own Idempotency-Key; the client owns its
        upload queue, concurrency, progress, and retry policy. The server
        decodes and validates the image, removes all location metadata, bakes
        orientation into the stored pixels, preserves the ICC colour profile,
        transcodes HEIC and HEIF sources to JPEG, chooses the stored filename
        and identifiers, and atomically publishes the image to the folder.
        External folders return a resource conflict.
        This synchronous storage write creates neither a Job nor History.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: >-
            Image stored. Repeating the same request with the same key returns
            this original response rather than creating a duplicate.
          headers:
            Location:
              description: Relative authenticated content URL for the image
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Encoded or decoded image exceeds Gallery limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported or undecodable still-image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/app/v1/gallery/images/{image_id}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/GalleryImageID"
    get:
      tags: [Gallery]
      operationId: getCompanionGalleryImageThumbnail
      summary: Read a cached Gallery thumbnail
      description: Requires gallery:read and the gallery feature.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Server-generated thumbnail
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: The cached thumbnail is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/gallery/images/{image_id}/content:
    parameters:
      - $ref: "#/components/parameters/GalleryImageID"
    get:
      tags: [Gallery]
      operationId: getCompanionGalleryImageContent
      summary: Read one normalized Gallery image
      description: >-
        Requires gallery:read and the gallery feature. The response is the
        server-owned stored image, not an arbitrary host filesystem path. A
        client may pass these bytes into the existing POST /api/app/v1/images
        Send flow; Gallery does not introduce a second delivery action or make
        Send depend on frame_cache support.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Stored image content
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Disposition:
              description: Safe display filename selected by the server
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: The stored image is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/image-urls:
    post:
      tags: [Images]
      operationId: pushCompanionImageURL
      summary: Fetch one public image URL and send it to explicit display targets
      description: >-
        Persist an asynchronous Job that fetches the source once through the
        strict Companion URL policy, then applies the selected fit per target
        through the existing push fan-out. The server must refuse private,
        loopback, link-local, and embedded-credential destinations, including
        redirect targets. There is no Companion override for this policy.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageURLPushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/webpages:
    post:
      tags: [Webpages]
      operationId: pushCompanionWebpage
      summary: Render one public webpage and send it to explicit display targets
      description: >-
        Persist an asynchronous Job that performs one bounded server-side
        top-level Chromium render at the logical viewport, then applies the
        selected fit per target through the existing push fan-out. The render
        must reuse the same queue, timeout, concurrency, cache, and rendering
        primitive as the Web UI's manual Server preview, without relying on
        whether the page permits iframe embedding. The Companion call uses the
        strict URL policy and, unlike a preview-only render, publishes and
        records canonical History.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebpagePushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/lineups:
    get:
      tags: [Lineups]
      operationId: listCompanionLineups
      summary: Read all Lineups without hiding advanced server-owned fields
      description: >-
        Requires lineups:read. The resource noun is Lineup even though the
        server's unified internal model is Deck. native_editable is advisory
        and server-computed; false never permits the client to discard fields.
      responses:
        "200":
          description: Complete Lineup definitions and lightweight runtime state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Lineups]
      operationId: createCompanionLineup
      summary: Create a native-editable Lineup from one of four intents
      description: >-
        Requires the optional lineups:write scope. Uses the same server-owned
        builder as Tesserae Web; saving the definition does not refresh a
        display. Binding an unassigned Dashboard is explicit and opt-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupCreateRequest"
      responses:
        "201":
          description: Created Lineup and its edit validator
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/lineups/{lineup_id}:
    parameters:
      - $ref: "#/components/parameters/LineupID"
    get:
      tags: [Lineups]
      operationId: getCompanionLineup
      summary: Read one complete Lineup
      responses:
        "200":
          description: Complete Lineup definition and runtime state
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Lineups]
      operationId: updateCompanionLineup
      summary: Partially edit a native-editable Lineup
      description: >-
        Requires lineups:write and the ETag returned by GET. Omitted fields
        retain their server values. A stale validator returns 412 instead of
        overwriting a concurrent web or app edit, and advanced Lineups remain
        web-only.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupPatchRequest"
      responses:
        "200":
          description: Updated Lineup and its new edit validator
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: If-Match no longer identifies the stored Lineup version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/app/v1/lineups/{lineup_id}/actions:
    parameters:
      - $ref: "#/components/parameters/LineupID"
    post:
      tags: [Lineups]
      operationId: controlCompanionLineup
      summary: Change Lineup state or repaint one or more bound displays
      description: >-
        Requires lineups:control. enable and disable are idempotent stored-state
        flips and return the updated Lineup synchronously. next, previous, and
        play repaint displays through Jobs, quiet-hours policy, idempotency, and
        canonical History. None of these actions edits the Lineup definition.
      parameters:
        - $ref: "#/components/parameters/ConditionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupActionRequest"
      responses:
        "200":
          description: Updated Lineup after enable or disable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Jobs]
      operationId: getCompanionJob
      summary: Poll an asynchronous render and publish job
      responses:
        "200":
          description: Current job state
          headers:
            Retry-After:
              description: Suggested poll delay in seconds while non-terminal
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/history:
    get:
      tags: [History]
      operationId: listCompanionHistory
      summary: List canonical server push History, newest first
      parameters:
        - in: query
          name: before_id
          required: false
          description: Opaque cursor returned as next_before_id by the previous page
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Requested page size, bounded by the server
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Canonical push History page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/app/v1/history/{history_id}/preview:
    parameters:
      - $ref: "#/components/parameters/HistoryID"
    get:
      tags: [History]
      operationId: getCompanionHistoryPreview
      summary: Read the retained composition thumbnail for a History row
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: >-
            Stored composition PNG identifying what was sent. This is not a
            device-final preview.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The cached History composition is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/history/{history_id}/resend:
    parameters:
      - $ref: "#/components/parameters/HistoryID"
    post:
      tags: [History]
      operationId: resendCompanionHistory
      summary: Republish a retained composition to its original target snapshot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryResendRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    CompanionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    DeviceID:
      in: path
      name: device_id
      required: true
      schema:
        type: string
    DashboardID:
      in: path
      name: dashboard_id
      required: true
      schema:
        type: string
    GalleryFolderID:
      in: path
      name: folder_id
      required: true
      description: Opaque Gallery folder identifier, never a host path
      schema:
        type: string
        minLength: 1
        maxLength: 256
    GalleryImageID:
      in: path
      name: image_id
      required: true
      description: Opaque Gallery image identifier, never a filename or host path
      schema:
        type: string
        minLength: 1
        maxLength: 512
    JobID:
      in: path
      name: job_id
      required: true
      schema:
        type: string
    HistoryID:
      in: path
      name: history_id
      required: true
      schema:
        type: string
    LineupID:
      in: path
      name: lineup_id
      required: true
      schema:
        type: string
    PersonalDataSourceID:
      in: path
      name: source_id
      required: true
      description: Strict source id advertised in personal_data.sources
      schema:
        $ref: "#/components/schemas/PersonalDataSourceID"
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >-
        Opaque client-generated key. Reusing a key with the same credential,
        method, path, and payload returns the original response; changing the
        payload returns idempotency_conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ConditionalIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: >-
        Required for next, previous, and play, which create asynchronous Jobs.
        Omit for enable and disable, whose state flips are idempotent by
        construction and return synchronously.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: ETag from a previously returned preview
      schema:
        type: string
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: ETag returned when the Lineup was read
      schema:
        type: string
  headers:
    ETag:
      description: Content-addressed resource validator
      schema:
        type: string
  responses:
    JobAccepted:
      description: Job persisted for asynchronous execution
      headers:
        Location:
          description: Relative URL of the job resource
          schema:
            type: string
        Retry-After:
          description: Suggested first poll delay in seconds
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or revoked Companion credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Valid Companion credential missing a required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not visible to this client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Pairing code, idempotency-key, or resource-state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Capabilities:
      type: object
      additionalProperties: false
      required: [product, server_version, api, pairing, features, limits, web_url]
      properties:
        product:
          type: string
          enum: [tesserae]
        server_version:
          type: string
        api:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name:
              type: string
              enum: [companion]
            version:
              type: integer
              minimum: 1
        pairing:
          type: object
          additionalProperties: false
          required: [supported, code_length, ttl_seconds]
          properties:
            supported:
              type: boolean
            code_length:
              type: integer
              minimum: 6
              maximum: 12
            ttl_seconds:
              type: integer
              minimum: 60
        features:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - devices
              - dashboards
              - dashboard_push
              - image_push
              - jobs
              - previews
              - history
              - image_url_push
              - webpage_push
              - image_framing
              - gallery
              - personal_data_reminders
              - personal_data_health
              - lineups
              - lineup_control
              - lineup_authoring
              - session_read
        personal_data:
          $ref: "#/components/schemas/PersonalDataCapabilities"
        limits:
          $ref: "#/components/schemas/Limits"
        web_url:
          type: string
    Limits:
      type: object
      additionalProperties: false
      required:
        - image_upload_bytes
        - image_max_edge
        - image_content_types
        - job_retention_seconds
        - idempotency_retention_seconds
      properties:
        image_upload_bytes:
          type: integer
          minimum: 1
        image_max_edge:
          type: integer
          minimum: 1
        image_content_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - image/jpeg
              - image/png
              - image/heic
              - image/heif
              - image/webp
        image_fit_modes:
          description: >-
            Image layout modes accepted by POST /images. When absent, clients
            must assume only fit and fill for compatibility with contract 0.2.0.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ImageFitMode"
        image_framing_max_zoom:
          description: >-
            Maximum zoom accepted inside ImageFraming. A server advertising
            image_framing must publish this limit so clients do not hard-code
            an editor range.
          type: number
          minimum: 1
        gallery_upload_bytes:
          description: >-
            Maximum encoded bytes in one Gallery image request. Required when
            gallery is advertised; each request contains exactly one image.
          type: integer
          minimum: 1
        gallery_image_content_types:
          description: >-
            Still-image media types accepted by Gallery upload. Required when
            gallery is advertised and independent from POST /images limits.
            These are source types, not a promise that the same media type is
            stored or returned after server normalization.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GalleryUploadContentType"
        gallery_upload_batch_size:
          description: >-
            Advisory maximum number of Photos selections the client should add
            to one managed upload batch. It is not an HTTP request cardinality;
            every request still contains exactly one image. Required when
            gallery is advertised.
          type: integer
          minimum: 1
        personal_data_stale_after_seconds:
          description: >-
            Age at which an accepted personal-data snapshot becomes stale.
            Required whenever any personal-data capability is advertised.
          type: integer
          minimum: 60
        personal_data_max_ttl_seconds:
          description: >-
            Maximum allowed difference between generated_at and expires_at.
            Required whenever any personal-data capability is advertised.
          type: integer
          minimum: 60
        job_retention_seconds:
          type: integer
          minimum: 60
        idempotency_retention_seconds:
          type: integer
          minimum: 60
    PersonalDataCapabilities:
      description: >-
        Strict personal-data source schemas accepted by this server. Absent on
        servers that predate source advertisement; those servers signal
        personal-data support through feature flags only.
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PersonalDataSourceID"
    PairingRequest:
      type: object
      additionalProperties: false
      required: [code, client]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6,12}$"
        client:
          type: object
          additionalProperties: false
          required: [name, platform, app_version, installation_id]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 80
            platform:
              type: string
              enum: [ios]
            app_version:
              type: string
            installation_id:
              type: string
              minLength: 16
              maxLength: 128
    PairingResponse:
      type: object
      additionalProperties: false
      required: [token, token_id, scopes, created_at, instance]
      properties:
        token:
          type: string
          minLength: 24
          writeOnly: true
        token_id:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - devices:read
              - dashboards:read
              - push:write
              - media:write
              - gallery:read
              - gallery:write
              - personal_data:write
              - lineups:read
              - lineups:control
        created_at:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/Instance"
    CompanionSessionAuthorization:
      type: object
      additionalProperties: false
      required: [token_id, scopes, settings_url]
      properties:
        token_id:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - devices:read
              - dashboards:read
              - push:write
              - media:write
              - gallery:read
              - gallery:write
              - personal_data:write
              - lineups:read
              - lineups:control
              - lineups:write
        settings_url:
          description: Relative URL for this token's Companion permission settings
          type: string
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, server_version, timezone, web_url]
      properties:
        id:
          type: string
        name:
          type: string
        server_version:
          type: string
        timezone:
          type: string
        web_url:
          type: string
    PersonalDataSourceID:
      type: string
      enum:
        - reminders
        - reminders.fridge
        - health.summary
    PersonalDataSnapshot:
      description: >-
        Versioned, expiring snapshot envelope. Each source is a strict schema;
        this is not an arbitrary JSON storage endpoint.
      oneOf:
        - $ref: "#/components/schemas/RemindersSnapshot"
        - $ref: "#/components/schemas/RemindersFridgeSnapshot"
        - $ref: "#/components/schemas/HealthSummarySnapshot"
      discriminator:
        propertyName: source_id
        mapping:
          reminders: "#/components/schemas/RemindersSnapshot"
          reminders.fridge: "#/components/schemas/RemindersFridgeSnapshot"
          health.summary: "#/components/schemas/HealthSummarySnapshot"
    RemindersSnapshot:
      type: object
      additionalProperties: false
      required: [version, source_id, generated_at, expires_at, data]
      properties:
        version:
          type: string
          enum: [personal_data_bridge_v1]
        source_id:
          type: string
          enum: [reminders]
        generated_at:
          type: string
          format: date-time
        expires_at:
          description: Required deletion deadline for raw snapshot values
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RemindersData"
    RemindersData:
      description: >-
        Incomplete items grouped by user-approved Apple Reminders lists. List
        identifiers are opaque, app-generated publication identifiers rather
        than EventKit calendar identifiers and must be unique within one
        snapshot; duplicate ids are rejected as invalid_snapshot (400). At
        most 200 items may appear across all lists in one snapshot. Exceeding
        that aggregate cap is rejected as invalid_snapshot (400), never
        truncated by the server. An empty lists array means no lists are
        currently published; the source remains fresh and widgets show their
        selected-list-unavailable state. DELETE is reserved for disabling the
        source.
      type: object
      additionalProperties: false
      required: [lists]
      properties:
        lists:
          description: >-
            Complete atomic set of currently published lists. An empty array is
            a valid enabled snapshot, not a request to delete the source.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReminderListSnapshot"
    ReminderListSnapshot:
      type: object
      additionalProperties: false
      required: [id, title, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 256
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReminderSnapshotItem"
    RemindersFridgeSnapshot:
      deprecated: true
      description: >-
        Deprecated one-list compatibility source retained for the already
        published reminders_fridge widget. New clients and widgets should use
        grouped reminders rather than implement this fallback.
      type: object
      additionalProperties: false
      required: [version, source_id, generated_at, expires_at, data]
      properties:
        version:
          type: string
          enum: [personal_data_bridge_v1]
        source_id:
          type: string
          enum: [reminders.fridge]
        generated_at:
          description: Time at which the iPhone generated this complete snapshot
          type: string
          format: date-time
        expires_at:
          description: >-
            Required deletion deadline for raw snapshot values. It must be later
            than generated_at and conform to the server retention policy.
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RemindersFridgeData"
    RemindersFridgeData:
      description: >-
        Incomplete items selected from one user-approved Reminders list. Notes,
        URLs, alarms, locations, and unrelated lists are never included.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReminderSnapshotItem"
    ReminderSnapshotItem:
      type: object
      additionalProperties: false
      required: [id, title, due_date, priority, completed]
      properties:
        id:
          description: Opaque reminder identifier used only inside this snapshot
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        due_date:
          description: Local calendar date selected in Reminders, or null
          type: string
          format: date
          nullable: true
        priority:
          description: Normalized priority rather than EventKit's numeric value
          type: string
          enum: [none, low, medium, high]
        completed:
          description: Defense-in-depth marker; the first source contains only incomplete items
          type: boolean
          enum: [false]
    HealthSummarySnapshot:
      description: >-
        Latest-only Apple Health summary for the active instance's seven most
        recent calendar dates. The iPhone performs selection, aggregation, and
        redaction before upload; this schema never accepts raw HealthKit
        samples, source identities, routes, heart rate, or free-form metadata.
      type: object
      additionalProperties: false
      required: [version, source_id, generated_at, expires_at, data]
      properties:
        version:
          type: string
          enum: [personal_data_bridge_v1]
        source_id:
          type: string
          enum: [health.summary]
        generated_at:
          type: string
          format: date-time
        expires_at:
          description: >-
            Required deletion deadline. The server's advertised maximum remains
            48 hours even though the content covers seven calendar dates.
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/HealthSummaryData"
    HealthSummaryData:
      description: >-
        Atomic optional sections selected for this Tesserae instance. All three
        section keys are explicit and nullable; at least one is non-null. Null
        does not disclose a specific HealthKit denial because Apple does not
        reveal individual read authorization decisions to apps. When a selected
        section is readable but contains no records, its object remains present
        with an empty array or explicit nullable values.
      type: object
      additionalProperties: false
      required:
        - time_zone
        - window_start_date
        - window_end_date
        - activity
        - sleep
        - workouts
      anyOf:
        - properties:
            activity:
              type: object
        - properties:
            sleep:
              type: object
        - properties:
            workouts:
              type: object
      properties:
        time_zone:
          description: IANA time zone of the active Tesserae instance
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._+-]+(?:/[A-Za-z0-9._+-]+)*$"
        window_start_date:
          type: string
          format: date
        window_end_date:
          type: string
          format: date
        activity:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthActivityData"
        sleep:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthSleepData"
        workouts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthWorkoutsData"
    HealthActivityData:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          description: Exactly one ascending record for each date in the window
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/HealthActivityDay"
    HealthActivityDay:
      type: object
      additionalProperties: false
      required:
        - date
        - steps
        - walking_running_distance_meters
        - move_mode
        - active_energy_kcal
        - active_energy_goal_kcal
        - move_minutes
        - move_goal_minutes
        - exercise_minutes
        - exercise_goal_minutes
        - stand_hours
        - stand_goal_hours
      properties:
        date:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
          maximum: 1000000
          nullable: true
        walking_running_distance_meters:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          nullable: true
        move_mode:
          type: string
          enum: [active_energy, move_time]
          nullable: true
        active_energy_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 100000
          nullable: true
        active_energy_goal_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 100000
          nullable: true
        move_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        move_goal_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        exercise_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        exercise_goal_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        stand_hours:
          type: integer
          minimum: 0
          maximum: 24
          nullable: true
        stand_goal_hours:
          type: integer
          minimum: 0
          maximum: 24
          nullable: true
    HealthSleepData:
      type: object
      additionalProperties: false
      required: [nights]
      properties:
        nights:
          description: At most one primary sleep episode per ascending wake date
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/HealthSleepNight"
    HealthSleepNight:
      type: object
      additionalProperties: false
      required:
        - wake_date
        - start_at
        - end_at
        - in_bed_minutes
        - asleep_minutes
        - awake_minutes
        - core_minutes
        - deep_minutes
        - rem_minutes
        - unspecified_minutes
      properties:
        wake_date:
          description: Calendar date containing end_at in data.time_zone
          type: string
          format: date
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        in_bed_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        asleep_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        awake_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        core_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        deep_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        rem_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        unspecified_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
    HealthWorkoutsData:
      type: object
      additionalProperties: false
      required: [items, items_truncated]
      properties:
        items:
          description: Up to 100 workouts sorted by start_at ascending
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/HealthWorkout"
        items_truncated:
          type: boolean
    HealthWorkout:
      type: object
      additionalProperties: false
      required:
        - id
        - activity_type
        - start_at
        - end_at
        - duration_seconds
        - active_energy_kcal
        - walking_running_distance_meters
        - cycling_distance_meters
        - swimming_distance_meters
        - wheelchair_distance_meters
        - flights_climbed
        - swimming_stroke_count
        - segments
        - segments_truncated
      properties:
        id:
          description: >-
            Stable per-instance publication id for the same workout across
            snapshots; never a HealthKit UUID and not correlatable across
            Tesserae instances.
          type: string
          pattern: "^[0-9a-f]{24}$"
        activity_type:
          $ref: "#/components/schemas/HealthWorkoutActivityType"
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        active_energy_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 100000
          nullable: true
        walking_running_distance_meters:
          type: number
          format: double
          minimum: 0
          maximum: 10000000
          nullable: true
        cycling_distance_meters:
          type: number
          format: double
          minimum: 0
          maximum: 10000000
          nullable: true
        swimming_distance_meters:
          type: number
          format: double
          minimum: 0
          maximum: 10000000
          nullable: true
        wheelchair_distance_meters:
          type: number
          format: double
          minimum: 0
          maximum: 10000000
          nullable: true
