{# Material theme override: inject the Umami analytics snippet into
   every page's <head>. ``extrahead`` is the documented hook for this;
   ``defer`` keeps the script off the critical-rendering path. #}
{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script defer src="https://analytics.dmello.io/script.js"
          data-website-id="7b9e5bc9-3332-46e7-8d4c-852ef0d4a2ce"></script>
{% endblock %}
