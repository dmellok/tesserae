site_name: Tesserae
site_description: Self-hosted e-ink dashboard companion. Compose tile dashboards, render headless, deliver frames to any panel over a small REST device API (MQTT retained topic still supported for existing setups).
site_url: https://docs.tesserae.ink/
repo_url: https://github.com/dmellok/tesserae
repo_name: dmellok/tesserae
edit_uri: edit/main/docs/
copyright: AGPL-3.0-or-later. A self-hosted hobby project, built in the open.

# docs/widget-build-prompt.md is an internal batch prompt, not a wiki page.
# docs/marketplace-catalog-seed/ is a copy-into-new-repo scaffold for the
# catalog repo, not user-facing wiki content.
exclude_docs: |
  widget-build-prompt.md
  marketplace-catalog-seed/

theme:
  name: material
  # overrides/main.html injects the PostHog analytics snippet into the
  # head of every page (configured for autocapture-off, no session
  # recording, no person profiles, DNT respected). v0.64.0 swapped
  # away from Umami. Docs traffic is the only signal collected; the
  # app itself sends no phone-home telemetry.
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  # Declaring plugins disables the implicit default, so re-add search.
  - search
  # Click any image to open it full-size in a lightbox overlay.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

